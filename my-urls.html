
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050507">
<title>URL Selector Terminal</title>

<style>
/* =========================================================
   THEME
   ========================================================= */

:root{
  --bg:#050507;
  --panel:#0c1220;
  --panel2:#0f1830;
  --text:#eaeaf2;
  --muted:#666;
  --accent:#00aaff;
  --green:#00ff99;
  --yellow:#ffcc00;
  --danger:#ff5577;
  --border:rgba(0,170,255,.25);
}

/* =========================================================
   BASE
   ========================================================= */

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

button,input,select,textarea{font-family:inherit}

button{cursor:pointer}

/* =========================================================
   CONTAINER
   ========================================================= */

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.card{
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
}

/* =========================================================
   HEADER
   ========================================================= */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

h1{
  margin:0;
  font-size:18px;
  color:var(--accent);
  font-family:monospace;
}

.header-status{
  font-family:monospace;
  font-size:11px;
  color:var(--green);
}

/* =========================================================
   TERMINAL
   ========================================================= */

.terminal{
  background:#000;
  border:1px solid var(--accent);
  border-radius:10px;
  padding:10px;
  font-family:monospace;
}

.terminal-title{
  color:#777;
  font-size:11px;
  margin-bottom:8px;
}

.terminal-title span{color:var(--accent)}

.command-line{
  display:flex;
  align-items:flex-start;
  gap:7px;
}

.prompt{
  color:var(--accent);
  font-size:16px;
  padding-top:10px;
}

#commandInput{
  flex:1;
  min-width:0;
  background:transparent;
  border:none;
  outline:none;
  resize:vertical;
  color:var(--green);
  font-family:monospace;
  font-size:16px;
  padding:10px 0;
}

#commandInput::placeholder{color:#444}

.log{
  margin-top:8px;
  max-height:110px;
  overflow:auto;
  border-top:1px solid #111;
  padding-top:7px;
  color:#777;
  font-size:11px;
}

.log-line{padding:2px 0}

.command-help{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:9px;
}

.command-help span{
  padding:4px 6px;
  border:1px solid #182333;
  border-radius:5px;
  color:#555;
  font-family:monospace;
  font-size:10px;
}

/* =========================================================
   SECTION HEADERS
   ========================================================= */

.section-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:10px;
}

.section-title{
  color:#aaa;
  font-size:13px;
  font-family:monospace;
}

.count{color:var(--green)}

/* =========================================================
   INPUTS
   ========================================================= */

.input-group{
  display:flex;
  flex-direction:column;
  gap:5px;
  margin-bottom:9px;
}

.input-label{
  color:#555;
  font-family:monospace;
  font-size:10px;
}

.field{
  width:100%;
  min-width:0;
  background:#05080e;
  border:1px solid #1d3045;
  border-radius:7px;
  color:var(--green);
  outline:none;
  padding:10px;
  font-family:monospace;
  font-size:14px;
}

.field:focus{
  border-color:var(--accent);
}

.field::placeholder{color:#444}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.action-button{
  border:1px solid #244;
  background:#09111d;
  color:#aaa;
  border-radius:7px;
  padding:9px 12px;
  cursor:pointer;
  font-family:monospace;
  font-size:11px;
}

.action-button:hover{
  border-color:var(--accent);
  color:white;
}

.primary-button{
  border-color:var(--accent);
  color:var(--accent);
}

.danger-button:hover{
  border-color:var(--danger);
  color:var(--danger);
}

/* =========================================================
   SEARCH
   ========================================================= */

.search-bar{
  margin-bottom:10px;
}

/* =========================================================
   FILTERS
   ========================================================= */

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:12px;
}

.filter-button{
  background:#080d17;
  border:1px solid #172438;
  border-radius:6px;
  padding:6px 9px;
  color:#666;
  font-family:monospace;
  font-size:10px;
}

.filter-button.active{
  border-color:var(--accent);
  color:var(--accent);
}

/* =========================================================
   URL CARDS
   ========================================================= */

.url-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.url-card{
  background:#080d17;
  border:1px solid #172438;
  border-radius:9px;
  overflow:hidden;
}

.url-card:hover{
  border-color:#345;
}

.url-main{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px;
}

.url-icon{
  width:35px;
  height:35px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0c1b2b;
  border:1px solid #18344e;
  border-radius:8px;
  color:var(--accent);
  font-family:monospace;
  font-size:15px;
}

.url-info{
  flex:1;
  min-width:0;
}

.url-name{
  display:block;
  color:#ddd;
  font-family:monospace;
  font-size:13px;
  word-break:break-word;
}

.url-address{
  display:block;
  color:#555;
  font-family:monospace;
  font-size:10px;
  margin-top:5px;
  word-break:break-all;
}

.url-category{
  display:inline-block;
  color:var(--green);
  font-family:monospace;
  font-size:9px;
  margin-top:6px;
}

.url-actions{
  display:flex;
  align-items:center;
  gap:4px;
}

.icon-button{
  background:none;
  border:1px solid transparent;
  border-radius:5px;
  color:#555;
  padding:7px;
  font-size:13px;
}

.icon-button:hover{
  border-color:#345;
  color:white;
}

.icon-button.favorite{
  color:var(--yellow);
}

.icon-button.delete:hover{
  color:var(--danger);
  border-color:var(--danger);
}

.open-button{
  display:block;
  width:100%;
  background:#09111d;
  border:none;
  border-top:1px solid #172438;
  color:var(--accent);
  padding:8px;
  font-family:monospace;
  font-size:10px;
  text-align:center;
}

.open-button:hover{
  background:#102238;
  color:white;
}

/* =========================================================
   EMPTY
   ========================================================= */

.empty{
  text-align:center;
  padding:25px 10px;
  color:#444;
  font-family:monospace;
  font-size:12px;
}

/* =========================================================
   EXPORT
   ========================================================= */

.output{
  background:#000;
  border:1px solid var(--accent);
  border-radius:10px;
  padding:12px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-family:monospace;
  font-size:12px;
  color:#aaa;
  max-height:200px;
  overflow:auto;
}

.export-actions{
  display:flex;
  gap:7px;
  margin-top:8px;
}

.export-actions button{
  flex:1;
  border:1px solid #244;
  background:#09111d;
  color:#777;
  border-radius:7px;
  padding:8px;
  cursor:pointer;
  font-family:monospace;
  font-size:11px;
}

.export-actions button:hover{
  color:white;
  border-color:var(--accent);
}

/* =========================================================
   STATUS
   ========================================================= */

.footer{
  text-align:center;
  color:#333;
  font-family:monospace;
  font-size:10px;
  padding:5px;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

  .container{padding:8px}
  .card{padding:11px}
  h1{font-size:16px}

  .form-grid{grid-template-columns:1fr}

  .url-main{gap:7px}
  .url-actions{gap:1px}

  .icon-button{padding:6px}

  .command-help span{font-size:9px}
}
</style>
</head>

<body>

<div class="container">

<!-- =====================================================
     HEADER
     ===================================================== -->

<div class="card">
  <div class="header">
    <h1>URL SELECTOR TERMINAL</h1>
    <div class="header-status">OFFLINE / LOCAL</div>
  </div>
</div>

<!-- =====================================================
     TERMINAL
     ===================================================== -->

<div class="card">

  <div class="terminal">

    <div class="terminal-title">
      <span>&gt;</span> COMMAND TERMINAL
    </div>

    <div class="command-line">
      <span class="prompt">&gt;</span>

      <textarea
        id="commandInput"
        rows="1"
        placeholder="add GitHub https://github.com"
      ></textarea>
    </div>

    <div id="log" class="log"></div>

    <div class="command-help">
      <span>add NAME URL</span>
      <span>open N</span>
      <span>delete N</span>
      <span>favorite N</span>
      <span>search TEXT</span>
      <span>list</span>
      <span>help</span>
    </div>

  </div>

</div>

<!-- =====================================================
     ADD URL
     ===================================================== -->

<div class="card">

  <div class="section-header">
    <div class="section-title">ADD URL</div>
  </div>

  <div class="input-group">
    <label class="input-label" for="urlName">NAME</label>
    <input
      id="urlName"
      class="field"
      placeholder="GitHub"
    >
  </div>

  <div class="input-group">
    <label class="input-label" for="urlAddress">URL</label>
    <input
      id="urlAddress"
      class="field"
      type="url"
      placeholder="https://github.com"
    >
  </div>

  <div class="form-grid">

    <div class="input-group">
      <label class="input-label" for="urlCategory">CATEGORY</label>
      <input
        id="urlCategory"
        class="field"
        placeholder="Development"
        list="categoryOptions"
      >

      <datalist id="categoryOptions"></datalist>
    </div>

    <div class="input-group">
      <label class="input-label" for="urlDescription">DESCRIPTION</label>
      <input
        id="urlDescription"
        class="field"
        placeholder="Source code repository"
      >
    </div>

  </div>

  <button
    class="action-button primary-button"
    style="width:100%"
    onclick="addUrlFromInput()"
  >
    + SAVE URL
  </button>

</div>

<!-- =====================================================
     SAVED URLS
     ===================================================== -->

<div class="card">

  <div class="section-header">

    <div class="section-title">
      SAVED URLS
      <span id="urlCount" class="count">(0)</span>
    </div>

    <div class="section-title" id="favoriteCount">
      ★ 0
    </div>

  </div>

  <input
    id="searchInput"
    class="field search-bar"
    placeholder="Search name, URL or category..."
  >

  <div id="filters" class="filters"></div>

  <div id="urlList" class="url-list"></div>

</div>

<!-- =====================================================
     EXPORT
     ===================================================== -->

<div class="card">

  <div class="section-header">
    <div class="section-title">EXPORT / BACKUP</div>
  </div>

  <div id="output" class="output"></div>

  <div class="export-actions">

    <button onclick="copyAll()">
      COPY ALL
    </button>

    <button onclick="exportAll()">
      EXPORT TXT
    </button>

    <button onclick="exportJSON()">
      BACKUP JSON
    </button>

  </div>

  <div style="margin-top:8px">
    <button
      class="action-button"
      style="width:100%"
      onclick="document.getElementById('importFile').click()"
    >
      IMPORT JSON BACKUP
    </button>

    <input
      type="file"
      id="importFile"
      accept=".json,application/json"
      hidden
      onchange="importJSON(event)"
    >
  </div>

</div>

<div class="footer">
  URL SELECTOR // LOCAL STORAGE // ZERO DEPENDENCIES
</div>

</div>

<script>

/* =========================================================
   DATA MODEL
   =========================================================

   urls = [

     {
       name: "GitHub",
       url: "https://github.com",
       category: "Development",
       description: "Source code",
       favorite: true,
       created: "..."
     }

   ]

   ========================================================= */

const STORAGE_KEY = "url_selector_terminal_v1";

let urls = [];

let activeCategory = "ALL";

let searchTerm = "";

let editingIndex = -1;


/* =========================================================
   LOAD
   ========================================================= */

function load(){

  try{

    const data = localStorage.getItem(STORAGE_KEY);

    if(data){

      const parsed = JSON.parse(data);

      if(parsed && Array.isArray(parsed.urls)){

        urls = parsed.urls.filter(item =>
          item &&
          typeof item.name === "string" &&
          typeof item.url === "string" &&
          validUrl(item.url)
        );

      }

    }

  }catch(e){

    urls = [];

    log("Storage could not be loaded");

  }

  render();

}


/* =========================================================
   SAVE
   ========================================================= */

function save(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify({urls:urls})
    );

    render();

  }catch(e){

    log("Storage error: unable to save");

  }

}


/* =========================================================
   URL VALIDATION
   ========================================================= */

function normalizeUrl(value){

  let url = value.trim();

  if(!url){

    return null;

  }

  if(!/^https?:\/\//i.test(url)){

    url = "https://" + url;

  }

  try{

    const parsed = new URL(url);

    if(
      parsed.protocol !== "https:" &&
      parsed.protocol !== "http:"
    ){

      return null;

    }

    if(!parsed.hostname){

      return null;

    }

    return parsed.href;

  }catch(e){

    return null;

  }

}


function validUrl(value){

  return normalizeUrl(value) !== null;

}


/* =========================================================
   LOG
   ========================================================= */

function log(message){

  const box = document.getElementById("log");

  const line = document.createElement("div");

  line.className = "log-line";

  line.textContent = "> " + message;

  box.appendChild(line);

  box.scrollTop = box.scrollHeight;

}


/* =========================================================
   ADD URL
   ========================================================= */

function addUrl(name,address,category,description){

  name = name.trim();

  if(!name){

    log("URL name required");

    return false;

  }

  const url = normalizeUrl(address);

  if(!url){

    log("Invalid URL. Use HTTP or HTTPS.");

    return false;

  }

  const duplicate = urls.findIndex(item =>
    item.url.toLowerCase() === url.toLowerCase()
  );

  if(duplicate !== -1){

    log("URL already exists: " + urls[duplicate].name);

    return false;

  }

  urls.push({

    name:name,

    url:url,

    category:category.trim() || "General",

    description:description.trim(),

    favorite:false,

    created:new Date().toISOString()

  });

  log("Saved: " + name);

  save();

  return true;

}


/* =========================================================
   ADD FROM INPUT
   ========================================================= */

function addUrlFromInput(){

  const name = document.getElementById("urlName");

  const address = document.getElementById("urlAddress");

  const category = document.getElementById("urlCategory");

  const description = document.getElementById("urlDescription");

  if(editingIndex !== -1){

    updateUrlFromInput();

    return;

  }

  if(addUrl(
    name.value,
    address.value,
    category.value,
    description.value
  )){

    name.value = "";
    address.value = "";
    description.value = "";

    name.focus();

  }

}


/* =========================================================
   EDIT URL
   ========================================================= */

function editUrl(index){

  const item = urls[index];

  if(!item)return;

  editingIndex = index;

  document.getElementById("urlName").value = item.name;

  document.getElementById("urlAddress").value = item.url;

  document.getElementById("urlCategory").value = item.category;

  document.getElementById("urlDescription").value = item.description || "";

  const button = document.querySelector(".primary-button");

  button.textContent = "SAVE CHANGES";

  document.getElementById("urlName").focus();

  log("Editing: " + item.name);

}


function updateUrlFromInput(){

  const item = urls[editingIndex];

  if(!item){

    cancelEdit();

    return;

  }

  const name = document.getElementById("urlName").value.trim();

  const address = normalizeUrl(
    document.getElementById("urlAddress").value
  );

  if(!name || !address){

    log("Name and valid URL required");

    return;

  }

  const duplicate = urls.findIndex((other,index) =>
    index !== editingIndex &&
    other.url.toLowerCase() === address.toLowerCase()
  );

  if(duplicate !== -1){

    log("URL already exists");

    return;

  }

  item.name = name;

  item.url = address;

  item.category =
    document.getElementById("urlCategory").value.trim() || "General";

  item.description =
    document.getElementById("urlDescription").value.trim();

  log("Updated: " + name);

  cancelEdit();

  save();

}


function cancelEdit(){

  editingIndex = -1;

  document.getElementById("urlName").value = "";

  document.getElementById("urlAddress").value = "";

  document.getElementById("urlCategory").value = "";

  document.getElementById("urlDescription").value = "";

  document.querySelector(".primary-button").textContent = "+ SAVE URL";

}


/* =========================================================
   OPEN URL
   ========================================================= */

function openUrl(index){

  const item = urls[index];

  if(!item)return;

  /*
    Open a new browser tab.
    noopener prevents the opened page
    from controlling this application.
  */

  const tab = window.open(
    item.url,
    "_blank",
    "noopener,noreferrer"
  );

  if(tab){

    log("Opening: " + item.name);

  }else{

    log("Popup blocked by browser");

  }

}


/* =========================================================
   DELETE URL
   ========================================================= */

function deleteUrl(index){

  const item = urls[index];

  if(!item)return;

  if(!confirm('Delete "' + item.name + '"?')){

    return;

  }

  log("Deleted: " + item.name);

  urls.splice(index,1);

  if(editingIndex === index){

    cancelEdit();

  }else if(editingIndex > index){

    editingIndex--;

  }

  save();

}


/* =========================================================
   FAVORITES
   ========================================================= */

function toggleFavorite(index){

  const item = urls[index];

  if(!item)return;

  item.favorite = !item.favorite;

  log(
    (item.favorite ? "Added to" : "Removed from") +
    " favorites: " + item.name
  );

  save();

}


/* =========================================================
   COPY URL
   ========================================================= */

async function copyUrl(index){

  const item = urls[index];

  if(!item)return;

  try{

    await navigator.clipboard.writeText(item.url);

    log("Copied: " + item.name);

  }catch(e){

    log("Clipboard unavailable");

  }

}


/* =========================================================
   SEARCH
   ========================================================= */

function searchUrls(value){

  searchTerm = value.toLowerCase().trim();

  renderUrls();

}


/* =========================================================
   CATEGORY FILTERS
   ========================================================= */

function getCategories(){

  return [
    "ALL",
    ...new Set(urls.map(item => item.category).filter(Boolean))
  ];

}


function setCategory(category){

  activeCategory = category;

  render();

}


function renderFilters(){

  const container = document.getElementById("filters");

  container.innerHTML = "";

  getCategories().forEach(category => {

    const button = document.createElement("button");

    button.className = "filter-button";

    if(category === activeCategory){

      button.classList.add("active");

    }

    button.textContent =
      category === "ALL" ? "ALL" : category;

    button.onclick = () => setCategory(category);

    container.appendChild(button);

  });

  document.getElementById("categoryOptions").innerHTML = "";

  getCategories()
    .filter(category => category !== "ALL")
    .forEach(category => {

      const option = document.createElement("option");

      option.value = category;

      document.getElementById("categoryOptions").appendChild(option);

    });

}


/* =========================================================
   RENDER URLS
   ========================================================= */

function renderUrls(){

  const container = document.getElementById("urlList");

  container.innerHTML = "";

  let filtered = urls.map((item,index) => ({
    item:item,
    index:index
  }));

  if(activeCategory !== "ALL"){

    filtered = filtered.filter(entry =>
      entry.item.category === activeCategory
    );

  }

  if(searchTerm){

    filtered = filtered.filter(entry => {

      const item = entry.item;

      return (
        item.name +
        " " +
        item.url +
        " " +
        item.category +
        " " +
        (item.description || "")
      ).toLowerCase().includes(searchTerm);

    });

  }

  if(filtered.length === 0){

    const empty = document.createElement("div");

    empty.className = "empty";

    empty.textContent = urls.length === 0
      ? "NO URLS SAVED"
      : "NO MATCHING URLS";

    container.appendChild(empty);

    return;

  }

  filtered.forEach(({item,index}) => {

    const card = document.createElement("div");

    card.className = "url-card";

    /* MAIN */

    const main = document.createElement("div");

    main.className = "url-main";

    const icon = document.createElement("div");

    icon.className = "url-icon";

    icon.textContent = "↗";

    const info = document.createElement("div");

    info.className = "url-info";

    const name = document.createElement("span");

    name.className = "url-name";

    name.textContent = item.name;

    const address = document.createElement("span");

    address.className = "url-address";

    address.textContent = item.url;

    const category = document.createElement("span");

    category.className = "url-category";

    category.textContent = "[" + item.category + "]";

    info.appendChild(name);

    info.appendChild(address);

    info.appendChild(category);

    if(item.description){

      const description = document.createElement("span");

      description.className = "url-address";

      description.textContent = item.description;

      info.appendChild(description);

    }

    /* ACTIONS */

    const actions = document.createElement("div");

    actions.className = "url-actions";

    const favorite = document.createElement("button");

    favorite.className = "icon-button";

    if(item.favorite){

      favorite.classList.add("favorite");

    }

    favorite.textContent = item.favorite ? "★" : "☆";

    favorite.title = "Toggle favorite";

    favorite.onclick = () => toggleFavorite(index);

    const copy = document.createElement("button");

    copy.className = "icon-button";

    copy.textContent = "⧉";

    copy.title = "Copy URL";

    copy.onclick = () => copyUrl(index);

    const edit = document.createElement("button");

    edit.className = "icon-button";

    edit.textContent = "✎";

    edit.title = "Edit URL";

    edit.onclick = () => editUrl(index);

    const remove = document.createElement("button");

    remove.className = "icon-button delete";

    remove.textContent = "×";

    remove.title = "Delete URL";

    remove.onclick = () => deleteUrl(index);

    actions.appendChild(favorite);

    actions.appendChild(copy);

    actions.appendChild(edit);

    actions.appendChild(remove);

    main.appendChild(icon);

    main.appendChild(info);

    main.appendChild(actions);

    /* OPEN BUTTON */

    const open = document.createElement("button");

    open.className = "open-button";

    open.textContent = "↗ OPEN WEBSITE";

    open.onclick = () => openUrl(index);

    card.appendChild(open);

    container.appendChild(card);

  });

}

/* =========================================================
   TERMINAL COMMANDS
   =========================================================

   add NAME URL
   open N
   delete N
   favorite N
   search TEXT
   list
   favorites
   categories
   use CATEGORY
   all
   help

   ========================================================= */

function runCommand(command){

  const text = command.trim();

  if(!text)return;

  /* ADD */

  const addMatch = text.match(/^add\s+(.+?)\s+(https?:\/\/\S+|\S+\.\S+(?:\/\S*)?)$/i);

  if(addMatch){

    addUrl(
      addMatch[1],
      addMatch[2],
      "General",
      ""
    );

    return;

  }

  /* LIST */

  if(/^list$/i.test(text)){

    if(urls.length === 0){

      log("No URLs saved");

      return;

    }

    urls.forEach((item,index) => {

      log(
        (index + 1) +
        ". " +
        item.name +
        " [" +
        item.category +
        "]"
      );

    });

    return;

  }

  /* OPEN */

  const openMatch = text.match(/^open\s+(\d+)$/i);

  if(openMatch){

    openUrl(parseInt(openMatch[1],10)-1);

    return;

  }

  /* DELETE */

  const deleteMatch = text.match(/^delete\s+(\d+)$/i);

  if(deleteMatch){

    deleteUrl(parseInt(deleteMatch[1],10)-1);

    return;

  }

  /* FAVORITE */

  const favoriteMatch = text.match(/^favorite\s+(\d+)$/i);

  if(favoriteMatch){

    toggleFavorite(parseInt(favoriteMatch[1],10)-1);

    return;

  }

  /* SEARCH */

  const searchMatch = text.match(/^search\s+(.+)$/i);

  if(searchMatch){

    document.getElementById("searchInput").value = searchMatch[1];

    searchUrls(searchMatch[1]);

    log("Search: " + searchMatch[1]);

    return;

  }

  /* FAVORITES */

  if(/^favorites$/i.test(text)){

    activeCategory = "ALL";

    searchTerm = "";

    document.getElementById("searchInput").value = "";

    render();

    const container = document.getElementById("urlList");

    container.innerHTML = "";

    urls.forEach((item,index) => {

      if(item.favorite){

        renderSingleFavorite(item,index,container);

      }

    });

    if(!urls.some(item => item.favorite)){

      container.innerHTML = '<div class="empty">NO FAVORITES</div>';

    }

    log("Showing favorites");

    return;

  }

  /* CATEGORIES */

  if(/^categories$/i.test(text)){

    getCategories().forEach(category => log(category));

    return;

  }

  /* USE CATEGORY */

  const useMatch = text.match(/^use\s+(.+)$/i);

  if(useMatch){

    const category = getCategories().find(item =>
      item.toLowerCase() === useMatch[1].toLowerCase()
    );

    if(category && category !== "ALL"){

      activeCategory = category;

      searchTerm = "";

      document.getElementById("searchInput").value = "";

      render();

      log("Category: " + category);

    }else{

      log("Category not found");

    }

    return;

  }

  /* ALL */

  if(/^all$/i.test(text)){

    activeCategory = "ALL";

    searchTerm = "";

    document.getElementById("searchInput").value = "";

    render();

    log("Showing all URLs");

    return;

  }

  /* HELP */

  if(/^help$/i.test(text)){

    log("add NAME URL | open N | delete N");

    log("favorite N | search TEXT | list");

    log("favorites | categories | use CATEGORY");

    log("all | help");

    return;

  }

  log("Unknown command: " + text);

}

/* =========================================================
   EXPORT TXT
   ========================================================= */

function downloadFile(content,filename,type){

  const blob = new Blob(
    [content],
    {type:type}
  );

  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");

  link.href = url;

  link.download = filename;

  document.body.appendChild(link);

  link.click();

  link.remove();

  setTimeout(() => URL.revokeObjectURL(url),1000);

}


function exportAll(){

  if(urls.length === 0){

    log("Nothing to export");

    return;

  }

  const text = urls.map(item =>
    item.name + "\n" +
    item.url + "\n" +
    "Category: " + item.category + "\n" +
    "Favorite: " + (item.favorite ? "YES" : "NO") + "\n"
  ).join("\n");

  downloadFile(
    text,
    "saved-urls.txt",
    "text/plain;charset=utf-8"
  );

  log("Exported saved-urls.txt");

}

function exportJSON(){

  downloadFile(
    JSON.stringify({urls:urls},null,2),
    "url-selector-backup.json",
    "application/json"
  );

  log("JSON backup exported");

}


/* =========================================================
   IMPORT JSON
   ========================================================= */

function importJSON(event){

  const file = event.target.files[0];

  if(!file)return;

  const reader = new FileReader();

  reader.onload = function(){

    try{

      const parsed = JSON.parse(reader.result);

      if(!parsed || !Array.isArray(parsed.urls)){

        throw new Error("Invalid backup format");

      }

      const imported = parsed.urls.filter(item =>

        item &&
        typeof item.name === "string" &&
        typeof item.url === "string" &&
        validUrl(item.url)

      );

      if(!confirm(
        "Import " + imported.length +
        " URLs? Existing URLs will be replaced."
      )){

        event.target.value = "";

        return;

      }

      urls = imported.map(item => ({

        name:item.name,

        url:normalizeUrl(item.url),

        category:item.category || "General",

        description:item.description || "",

        favorite:Boolean(item.favorite),

        created:item.created || new Date().toISOString()

      }));

      activeCategory = "ALL";

      searchTerm = "";

      document.getElementById("searchInput").value = "";

      save();

      log("Imported " + urls.length + " URLs");

    }catch(e){

      log("Import failed: invalid JSON");

    }

    event.target.value = "";

  };

  reader.readAsText(file);

}
