<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Panel</title>

<style>
:root{
  --bg:#050507;
  --panel:#0c1220;
  --panel2:#0f1830;
  --text:#eaeaf2;
  --accent:#00aaff;
}

/* base */
body{
  margin:0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color:var(--text);
}

/* top bar */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 16px;
}

.title{
  font-size:14px;
  letter-spacing:2px;
  opacity:0.8;
}

/* layout */
.container{
  padding:16px;
  max-width:600px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* cards */
.card{
  background: linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid rgba(0,170,255,0.25);
  border-radius:14px;
  padding:18px;
}

h2{
  margin-top:0;
  font-size:16px;
  letter-spacing:1px;
}

/* textarea */
textarea{
  width:100%;
  height:160px;
  background:#000;
  color:#0f0;
  border:1px solid var(--accent);
  border-radius:10px;
  padding:10px;
  font-family: monospace;
}

/* iframe */
iframe{
  width:100%;
  height:180px;
  border:none;
  border-radius:10px;
  background:#fff;
}

/* console */
.console{
  background:#000;
  color:#0f0;
  font-family: monospace;
  font-size:12px;
  padding:10px;
  height:120px;
  overflow:auto;
  border-radius:10px;
  border:1px solid var(--accent);
}

/* buttons */
button{
  width:100%;
  background:#000;
  color:#fff;
  border:1px solid var(--accent);
  padding:14px;
  border-radius:10px;
  cursor:pointer;
  margin-top:10px;
  font-weight:bold;

  box-shadow:
    0 0 6px rgba(0,170,255,0.4),
    0 0 12px rgba(0,170,255,0.2);

  transition:all 0.12s ease;
}

button:hover{
  box-shadow:
    0 0 10px rgba(0,170,255,0.6),
    0 0 18px rgba(0,170,255,0.3);
}

button:active{
  transform:scale(0.96);
}

/* text */
.desc{
  font-size:13px;
  opacity:0.75;
  margin-bottom:10px;
}

.footer{
  text-align:center;
  font-size:11px;
  opacity:0.4;
  padding:10px;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="title">CONTROL PANEL</div>
</div>

<div class="container">

  <div class="card">
    <h2>EDITOR</h2>
    <div class="desc">Write HTML + CSS + JS</div>
    <textarea id="code"></textarea>
    <button onclick="runCode()">RUN</button>
  </div>

  <div class="card">
    <h2>OUTPUT</h2>
    <iframe id="output"></iframe>
  </div>

  <div class="card">
    <h2>CONSOLE</h2>
    <div class="console" id="console"></div>
  </div>

</div>

<div class="footer">local session saved</div>

<script>
const textarea = document.getElementById("code");
const iframe = document.getElementById("output");
const consoleBox = document.getElementById("console");

const defaultCode = `<h1>Hello</h1>
<script>
console.log("Hello from inside iframe");
<\/script>`;

// load saved
textarea.value = localStorage.getItem("my_code") || defaultCode;

function logToConsole(msg){
  const line = document.createElement("div");
  line.textContent = msg;
  consoleBox.appendChild(line);
  consoleBox.scrollTop = consoleBox.scrollHeight;
}

function runCode(){
  consoleBox.innerHTML = "";

  const userCode = textarea.value;

  const wrapped = `
  <script>
    const oldLog = console.log;
    console.log = function(...args){
      parent.postMessage({type:'log', data: args.join(' ')}, '*');
      oldLog.apply(console, args);
    };

    window.onerror = function(msg){
      parent.postMessage({type:'error', data: msg}, '*');
    };
  <\/script>
  ` + userCode;

  iframe.srcdoc = wrapped;
}

// listen for logs
window.addEventListener("message", (e)=>{
  if(e.data.type === "log"){
    logToConsole("LOG: " + e.data.data);
  }
  if(e.data.type === "error"){
    logToConsole("ERROR: " + e.data.data);
  }
});

// auto-save
textarea.addEventListener("input", ()=>{
  localStorage.setItem("my_code", textarea.value);
});

runCode();
</script>

</body>
</html>
