<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Panel</title>

<style>
:root{
  --bg:#050507;
  --panel:#0c1220;
  --panel2:#0f1830;
  --text:#eaeaf2;
  --accent:#00aaff;
}

body{
  margin:0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color:var(--text);
}

.topbar{
  padding:10px 16px;
}

.title{
  font-size:14px;
  letter-spacing:2px;
  opacity:0.8;
}

.container{
  padding:16px;
  max-width:600px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.card{
  background: linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid rgba(0,170,255,0.25);
  border-radius:14px;
  padding:18px;
}

h2{
  margin-top:0;
  font-size:16px;
}

/* resizable wrapper */
.resizable{
  position:relative;
  height:180px;
}

/* resize handle */
.handle{
  height:10px;
  cursor:ns-resize;
  position:absolute;
  bottom:0;
  left:0;
  right:0;
}

/* textarea */
textarea{
  width:100%;
  height:100%;
  background:#000;
  color:#0f0;
  border:1px solid var(--accent);
  border-radius:10px;
  padding:10px;
  font-family: monospace;
  box-sizing:border-box;
}

/* iframe */
iframe{
  width:100%;
  height:100%;
  border:none;
  border-radius:10px;
  background:#fff;
}

/* console */
.console{
  width:100%;
  height:100%;
  background:#000;
  color:#0f0;
  font-family: monospace;
  font-size:12px;
  padding:10px;
  overflow:auto;
  border-radius:10px;
  border:1px solid var(--accent);
  box-sizing:border-box;
}

/* button */
button{
  width:100%;
  margin-top:10px;
  padding:12px;
  background:#000;
  color:#fff;
  border:1px solid var(--accent);
  border-radius:10px;
  cursor:pointer;
}

.desc{
  font-size:13px;
  opacity:0.75;
}

.footer{
  text-align:center;
  font-size:11px;
  opacity:0.4;
  padding:10px;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="title">CONTROL PANEL</div>
</div>

<div class="container">

  <!-- EDITOR -->
  <div class="card">
    <h2>EDITOR</h2>
    <div class="desc">Write HTML + CSS + JS</div>

    <div class="resizable" id="editorWrap">
      <textarea id="code"></textarea>
      <div class="handle"></div>
    </div>

    <button onclick="runCode()">RUN</button>
  </div>

  <!-- OUTPUT -->
  <div class="card">
    <h2>OUTPUT</h2>

    <div class="resizable" id="outputWrap">
      <iframe id="output"></iframe>
      <div class="handle"></div>
    </div>

  </div>

  <!-- CONSOLE -->
  <div class="card">
    <h2>CONSOLE</h2>

    <div class="resizable" id="consoleWrap">
      <div class="console" id="console"></div>
      <div class="handle"></div>
    </div>

  </div>

</div>

<div class="footer">local session saved</div>

<script>
const textarea = document.getElementById("code");
const iframe = document.getElementById("output");
const consoleBox = document.getElementById("console");

const defaultCode = `<h1>Hello</h1>
<script>
console.log("Hello from iframe");
<\/script>`;

textarea.value = localStorage.getItem("my_code") || defaultCode;

// console output
function log(msg){
  const line = document.createElement("div");
  line.textContent = msg;
  consoleBox.appendChild(line);
  consoleBox.scrollTop = consoleBox.scrollHeight;
}

// run code
function runCode(){
  consoleBox.innerHTML = "";

  const wrapped = `
  <script>
    const oldLog = console.log;
    console.log = (...args)=>{
      parent.postMessage({type:'log', data: args.join(' ')}, '*');
    };

    window.onerror = (msg)=>{
      parent.postMessage({type:'error', data: msg}, '*');
    };
  <\/script>
  ` + textarea.value;

  iframe.srcdoc = wrapped;
}

// receive logs
window.addEventListener("message", (e)=>{
  if(e.data.type === "log"){
    log("LOG: " + e.data.data);
  }
  if(e.data.type === "error"){
    log("ERROR: " + e.data.data);
  }
});

// save
textarea.addEventListener("input", ()=>{
  localStorage.setItem("my_code", textarea.value);
});

// generic resize logic
document.querySelectorAll(".resizable").forEach(wrapper=>{
  const handle = wrapper.querySelector(".handle");
  let isResizing = false;

  handle.addEventListener("mousedown", ()=>{
    isResizing = true;
  });

  document.addEventListener("mousemove", (e)=>{
    if(!isResizing) return;
    const rect = wrapper.getBoundingClientRect();
    const newHeight = e.clientY - rect.top;
    wrapper.style.height = newHeight + "px";
  });

  document.addEventListener("mouseup", ()=>{
    isResizing = false;
  });
});

// initial run
runCode();
</script>

</body>
</html>
