<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Panel</title>

<style>
:root{
  --bg:#050507;
  --panel:#0c1220;
  --panel2:#0f1830;
  --text:#eaeaf2;
  --accent:#00aaff;
}

body{
  margin:0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color:var(--text);
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 16px;
}

.title{
  font-size:14px;
  letter-spacing:2px;
  opacity:0.8;
}

.container{
  padding:16px;
  max-width:600px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.card{
  background: linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid rgba(0,170,255,0.25);
  border-radius:14px;
  padding:18px;
}

h2{
  margin-top:0;
  font-size:16px;
}

/* textarea */
textarea{
  width:100%;
  height:160px;
  background:#000;
  color:#0f0;
  border:1px solid var(--accent);
  border-radius:10px;
  padding:10px;
  font-family: monospace;
}

/* resizable container */
.output-wrapper{
  position:relative;
  min-height:120px;
}

/* iframe */
iframe{
  width:100%;
  height:100%;
  border:none;
  border-radius:10px;
  background:#fff;
}

/* resize handle */
.resize-handle{
  height:10px;
  background:transparent;
  cursor:ns-resize;
  position:absolute;
  bottom:0;
  left:0;
  right:0;
}

/* console */
.console{
  background:#000;
  color:#0f0;
  font-family: monospace;
  font-size:12px;
  padding:10px;
  height:120px;
  overflow:auto;
  border-radius:10px;
  border:1px solid var(--accent);
}

/* button */
button{
  width:100%;
  background:#000;
  color:#fff;
  border:1px solid var(--accent);
  padding:14px;
  border-radius:10px;
  cursor:pointer;
  margin-top:10px;
}

/* text */
.desc{
  font-size:13px;
  opacity:0.75;
}

.footer{
  text-align:center;
  font-size:11px;
  opacity:0.4;
  padding:10px;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="title">CONTROL PANEL</div>
</div>

<div class="container">

  <div class="card">
    <h2>EDITOR</h2>
    <div class="desc">Write HTML + CSS + JS</div>
    <textarea id="code"></textarea>
    <button onclick="runCode()">RUN</button>
  </div>

  <div class="card">
    <h2>OUTPUT</h2>
    <div class="output-wrapper" id="outputWrapper">
      <iframe id="output"></iframe>
      <div class="resize-handle" id="resizeHandle"></div>
    </div>
  </div>

  <div class="card">
    <h2>CONSOLE</h2>
    <div class="console" id="console"></div>
  </div>

</div>

<div class="footer">local session saved</div>

<script>
const textarea = document.getElementById("code");
const iframe = document.getElementById("output");
const consoleBox = document.getElementById("console");
const wrapper = document.getElementById("outputWrapper");
const handle = document.getElementById("resizeHandle");

let manualResize = false;

// default code
const defaultCode = `<h1>Hello</h1>
<script>
console.log("Hello from iframe");
<\/script>`;

textarea.value = localStorage.getItem("my_code") || defaultCode;

function logToConsole(msg){
  const line = document.createElement("div");
  line.textContent = msg;
  consoleBox.appendChild(line);
  consoleBox.scrollTop = consoleBox.scrollHeight;
}

function runCode(){
  consoleBox.innerHTML = "";

  const wrapped = `
  <script>
    function sendHeight(){
      const height = document.body.scrollHeight;
      parent.postMessage({type:'resize', height}, '*');
    }

    window.onload = sendHeight;
    setInterval(sendHeight, 300);

    const oldLog = console.log;
    console.log = function(...args){
      parent.postMessage({type:'log', data: args.join(' ')}, '*');
    };

    window.onerror = function(msg){
      parent.postMessage({type:'error', data: msg}, '*');
    };
  <\/script>
  ` + textarea.value;

  iframe.srcdoc = wrapped;
}

// receive messages
window.addEventListener("message", (e)=>{
  if(e.data.type === "log"){
    logToConsole("LOG: " + e.data.data);
  }

  if(e.data.type === "error"){
    logToConsole("ERROR: " + e.data.data);
  }

  if(e.data.type === "resize" && !manualResize){
    wrapper.style.height = e.data.height + "px";
  }
});

// auto-save
textarea.addEventListener("input", ()=>{
  localStorage.setItem("my_code", textarea.value);
});

// resize logic
let isResizing = false;

handle.addEventListener("mousedown", () => {
  isResizing = true;
  manualResize = true;
});

document.addEventListener("mousemove", (e)=>{
  if(!isResizing) return;
  const rect = wrapper.getBoundingClientRect();
  const newHeight = e.clientY - rect.top;
  wrapper.style.height = newHeight + "px";
});

document.addEventListener("mouseup", ()=>{
  isResizing = false;
});

// initial run
runCode();
</script>

</body>
</html>
