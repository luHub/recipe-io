<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Panel</title><style>
:root{
  --bg:#050507;
  --panel:#0c1220;
  --panel2:#0f1830;
  --text:#eaeaf2;
  --accent:#00aaff;
}

body{
  margin:0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color:var(--text);
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 16px;
}

.title{
  font-size:14px;
  letter-spacing:2px;
  opacity:0.8;
}

.container{
  padding:16px;
  max-width:1000px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.card{
  background: linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid rgba(0,170,255,0.25);
  border-radius:14px;
  padding:18px;
}

h2{
  margin-top:0;
  font-size:16px;
  letter-spacing:1px;
}

textarea{
  width:100%;
  min-height:150px;
  background:#000;
  color:#0f0;
  border:1px solid var(--accent);
  border-radius:10px;
  padding:10px;
  font-family:monospace;
  resize: both; /* ✅ FIX: allow resize */
  overflow:auto; /* ✅ required for resize to work */
  box-sizing:border-box;
}

iframe{
  width:100%;
  height:200px;
  border:1px solid var(--accent);
  border-radius:10px;
  background:#fff;
  resize: both;
  overflow:auto;
}

.console{
  width:100%;
  min-height:120px;
  background:#000;
  color:#0f0;
  border:1px solid var(--accent);
  border-radius:10px;
  padding:10px;
  font-family:monospace;
  overflow:auto;
  resize: both;
}

button{
  width:100%;
  background:#000;
  color:#fff;
  border:1px solid var(--accent);
  padding:14px;
  border-radius:10px;
  cursor:pointer;
  margin-top:10px;
  font-weight:bold;

  box-shadow:
    0 0 6px rgba(0,170,255,0.4),
    0 0 12px rgba(0,170,255,0.2);

  transition:all 0.12s ease;
}

button:hover{
  box-shadow:
    0 0 10px rgba(0,170,255,0.6),
    0 0 18px rgba(0,170,255,0.3);
}

button:active{
  transform:scale(0.96);
  box-shadow:
    0 0 16px rgba(0,170,255,0.9),
    0 0 28px rgba(0,170,255,0.5);
}

.footer{
  text-align:center;
  font-size:11px;
  opacity:0.4;
  padding:10px;
}
</style></head><body><div class="topbar">
  <div class="title">MINI WEB EDITOR</div>
</div><div class="container">  <div class="card">
    <h2>Editor</h2>
    <textarea id="editor"><!DOCTYPE html>
<html>
<head>
<style>
body { background: black; color: lime; }
</style>
</head>
<body>
<script>
console.log("Hello from editor");
</script>
Hello World
</body>
</html></textarea>
    <button onclick="runCode()">Run</button>
  </div>  <div class="card">
    <h2>Output</h2>
    <iframe id="output"></iframe>
  </div>  <div class="card">
    <h2>Console</h2>
    <div id="console" class="console"></div>
  </div></div><div class="footer">local runtime • no dependencies</div><script>
function runCode(){
  const code = document.getElementById("editor").value;
  const iframe = document.getElementById("output");
  const consoleDiv = document.getElementById("console");

  consoleDiv.innerHTML = "";

  const wrapped = `
  <script>
    const log = (...args) => {
      parent.postMessage({type:'log', data: args}, '*');
    };
    console.log = log;
    console.error = log;
    console.warn = log;
  <\/script>
  ${code}
  `;

  iframe.srcdoc = wrapped;
}

window.addEventListener("message", (e)=>{
  if(e.data.type === "log"){
    const consoleDiv = document.getElementById("console");
    const line = document.createElement("div");
    line.textContent = e.data.data.join(" ");
    consoleDiv.appendChild(line);
    consoleDiv.scrollTop = consoleDiv.scrollHeight;
  }
});
</script></body>
</html>
