<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { margin:0; background:#000; color:#0f0; font-family:monospace; }
canvas { width:100%; height:60vh; display:block; }
#ui { padding:10px; }
button { margin:5px; padding:10px; font-size:16px; }
</style>
</head>
<body>

<canvas id="gl"></canvas>

<div id="ui">
  <button onclick="start()">▶ Start Camera</button>
  <button onclick="capture()">📸 Capture</button>
  <div id="status">idle</div>
</div>

<script>
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl");

// ---------- resize ----------
function resize(){
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}
resize();
window.addEventListener("resize", resize);

// ---------- shaders ----------
const vs = `
attribute vec2 p;
varying vec2 uv;
void main(){
  uv = (p+1.0)*0.5;
  gl_Position = vec4(p,0,1);
}`;

const fs = `
precision mediump float;
uniform sampler2D tex;
varying vec2 uv;

void main(){
  vec2 t = vec2(uv.x, 1.0-uv.y);
  vec4 c = texture2D(tex, t);

  // crosshair
  float cross =
    step(abs(uv.x-0.5), 0.002) +
    step(abs(uv.y-0.5), 0.002);

  vec3 overlay = cross > 0.0 ? vec3(0.0,1.0,0.0) : vec3(0.0);

  gl_FragColor = vec4(c.rgb + overlay, 1.0);
}`;

// ---------- compile ----------
function compile(type, src){
  let s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  return s;
}

let prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);

// ---------- quad ----------
let buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
  -1,-1, 1,-1, -1,1, 1,1
]), gl.STATIC_DRAW);

let loc = gl.getAttribLocation(prog, "p");
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

// ---------- texture ----------
let tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);

// init texture (important)
gl.texImage2D(
  gl.TEXTURE_2D,0,gl.RGBA,
  1,1,0,
  gl.RGBA,gl.UNSIGNED_BYTE,
  new Uint8Array([0,0,0,255])
);

gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
gl.uniform1i(gl.getUniformLocation(prog, "tex"), 0);

// ---------- video ----------
let video = document.createElement("video");
video.playsInline = true;
video.muted = true;

let started = false;

// ---------- START ----------
async function start(){
  if(started) return;
  started = true;

  document.getElementById("status").innerText = "starting camera...";

  const stream = await navigator.mediaDevices.getUserMedia({
    video:{ facingMode:"environment" }
  });

  video.srcObject = stream;
  await video.play();

  document.getElementById("status").innerText = "camera running";

  startRendering();
}

// ---------- rendering ----------
function startRendering(){

  // 🔥 BEST: modern browsers
  if(video.requestVideoFrameCallback){
    const render = ()=>{
      draw();
      video.requestVideoFrameCallback(render);
    };
    video.requestVideoFrameCallback(render);
  }
  else{
    // fallback
    function loop(){
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  }
}

function draw(){
  resize();
  gl.viewport(0,0,canvas.width,canvas.height);

  gl.clear(gl.COLOR_BUFFER_BIT);

  if(video.readyState >= 2){
    gl.bindTexture(gl.TEXTURE_2D, tex);

    gl.texImage2D(
      gl.TEXTURE_2D,0,gl.RGBA,
      gl.RGBA,gl.UNSIGNED_BYTE,
      video
    );
  }

  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

// ---------- capture ----------
function capture(){
  document.getElementById("status").innerText = "captured";
}
</script>

</body>
</html>
