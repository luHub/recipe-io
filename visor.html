<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#050507;
  --panel:#0c1220;
  --panel2:#0f1830;
  --text:#eaeaf2;
  --accent:#00aaff;
}

body{
  margin:0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color:var(--text);
}

.topbar{
  display:flex;
  justify-content:space-between;
  padding:10px 16px;
}

.title{
  font-size:14px;
  letter-spacing:2px;
  opacity:0.8;
}

.container{
  padding:16px;
  max-width:600px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.card{
  background: linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid rgba(0,170,255,0.25);
  border-radius:14px;
  padding:18px;
}

button{
  width:100%;
  background:#000;
  color:#fff;
  border:1px solid var(--accent);
  padding:14px;
  border-radius:10px;
  cursor:pointer;
  margin-top:10px;
}

canvas{
  width:100%;
  height:260px;
  border-radius:12px;
  border:1px solid rgba(0,170,255,0.3);
}

#orbit{
  height:160px;
}

#gallery{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.item{
  width:100px;
  font-size:9px;
}

.item img{
  width:100%;
  border:1px solid var(--accent);
  border-radius:6px;
}

#log{
  height:80px;
  overflow:auto;
  border:1px solid rgba(0,170,255,0.3);
  padding:8px;
  font-size:10px;
  border-radius:8px;
  background:#000;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="title">3D SCANNER v1.0</div>
</div>

<div class="container">

  <div class="card">
    <canvas id="gl"></canvas>

    <button onclick="start()">▶ Start Camera</button>
    <button onclick="enableSensors()">📡 Enable Sensors</button>
    <button onclick="capture()">📸 Capture</button>
    <button onclick="downloadAll()">⬇️ Download</button>
  </div>

  <div class="card">
    <canvas id="orbit"></canvas>
  </div>

  <div class="card">
    <div id="gallery"></div>
  </div>

  <div class="card">
    <div id="log"></div>
  </div>

</div>

<script>

// ---------- LOG ----------
function log(msg){
  document.getElementById("log").innerText += msg + "\n";
}

// ---------- WEBGL ----------
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl");

function resize(){
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}

// ---------- SHADERS ----------
const vs = `
attribute vec2 p;
varying vec2 uv;
void main(){
 uv=(p+1.0)*0.5;
 uv.y = 1.0 - uv.y; // FIX flip
 gl_Position=vec4(p,0,1);
}`;

const fs = `
precision mediump float;
uniform sampler2D tex;
varying vec2 uv;

void main(){
 vec4 c = texture2D(tex, uv);

 float cross =
   step(abs(uv.x-0.5), 0.002) +
   step(abs(uv.y-0.5), 0.002);

 gl_FragColor = vec4(c.rgb + (cross>0.0?vec3(0,1,0):vec3(0)),1.0);
}`;

// ---------- INIT ----------
function compile(type,src){
 let s=gl.createShader(type);
 gl.shaderSource(s,src);
 gl.compileShader(s);
 return s;
}

let prog=gl.createProgram();
gl.attachShader(prog,compile(gl.VERTEX_SHADER,vs));
gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(prog);
gl.useProgram(prog);

// ---------- QUAD ----------
let buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([
 -1,-1, 1,-1, -1,1, 1,1
]),gl.STATIC_DRAW);

let loc=gl.getAttribLocation(prog,"p");
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

// ---------- TEXTURE ----------
let tex=gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D,tex);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);

gl.uniform1i(gl.getUniformLocation(prog,"tex"),0);

// ---------- VIDEO ----------
let video=document.createElement("video");
video.playsInline=true;
video.muted=true;

// ---------- SENSOR DATA ----------
let orientationData={alpha:0,beta:0,gamma:0};
let motionData={};

// ---------- ENABLE SENSORS ----------
async function enableSensors(){

 try{
   if(DeviceOrientationEvent?.requestPermission){
     await DeviceOrientationEvent.requestPermission();
   }

   if(DeviceMotionEvent?.requestPermission){
     await DeviceMotionEvent.requestPermission();
   }

   window.addEventListener("deviceorientation",(e)=>{
     orientationData={
       alpha:e.alpha||0,
       beta:e.beta||0,
       gamma:e.gamma||0
     };
   });

   window.addEventListener("devicemotion",(e)=>{
     motionData={
       accel:e.acceleration,
       accelG:e.accelerationIncludingGravity,
       rotation:e.rotationRate,
       interval:e.interval
     };
   });

   log("Sensors enabled");

 }catch(err){
   log("Sensor error");
 }
}

// ---------- ORBIT ----------
const orbitCanvas=document.getElementById("orbit");
const orbitCtx=orbitCanvas.getContext("2d");

const YAW_STEPS=12;
const PITCH_STEPS=6;

let visited=new Set();

function getCell(){
 let yaw=Math.floor((orientationData.alpha%360)/30);
 let pitch=Math.floor((orientationData.beta+90)/30);
 return yaw+"_"+pitch;
}

function drawOrbit(){
 let w=orbitCanvas.width/YAW_STEPS;
 let h=orbitCanvas.height/PITCH_STEPS;

 orbitCtx.clearRect(0,0,orbitCanvas.width,orbitCanvas.height);

 let current=getCell();

 for(let y=0;y<PITCH_STEPS;y++){
  for(let x=0;x<YAW_STEPS;x++){

   let key=x+"_"+y;

   let color="#111";

   if(visited.has(key)) color="#00ff88";
   if(key===current) color="#00aaff";

   orbitCtx.fillStyle=color;
   orbitCtx.fillRect(x*w,y*h,w-2,h-2);
  }
 }
}

// ---------- START ----------
async function start(){
 const stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:"environment"}
 });

 video.srcObject=stream;
 await video.play();

 render();
 log("Camera started");
}

// ---------- RENDER ----------
function render(){

 resize();
 gl.viewport(0,0,canvas.width,canvas.height);
 gl.clear(gl.COLOR_BUFFER_BIT);

 if(video.readyState>=2){
   gl.bindTexture(gl.TEXTURE_2D,tex);
   gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,
     gl.RGBA,gl.UNSIGNED_BYTE,video);
 }

 gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

 visited.add(getCell());
 drawOrbit();

 document.getElementById("log").innerText =
   "Coverage: "+visited.size+" / 72\n" +
   "Suggestion: "+(visited.size<20?"Move around object":"Fill gaps");

 requestAnimationFrame(render);
}

// ---------- CAPTURE ----------
let captures=[];

function capture(){

 let c=document.createElement("canvas");
 c.width=video.videoWidth;
 c.height=video.videoHeight;
 c.getContext("2d").drawImage(video,0,0);

 let data=c.toDataURL();

 let meta={
   version:"v1.0",
   time:new Date().toISOString(),
   orientation:orientationData,
   motion:motionData,
   cell:getCell(),
   coverage:visited.size,
   resolution:video.videoWidth+"x"+video.videoHeight
 };

 captures.push({data,meta});

 let div=document.createElement("div");
 div.className="item";

 div.innerHTML=`
   <img src="${data}">
   <div>${JSON.stringify(meta,null,1)}</div>
 `;

 document.getElementById("gallery").appendChild(div);
}

// ---------- DOWNLOAD ----------
function downloadAll(){
 captures.forEach((c,i)=>{
   let a=document.createElement("a");
   a.href=c.data;
   a.download="capture_"+i+".png";
   a.click();
 });
}

</script>

</body>
</html>
