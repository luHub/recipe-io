<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body { margin:0; background:#000; font-family:sans-serif; color:#fff; overflow:hidden; }
canvas { width:100vw; height:100vh; display:block; }

#ui {
  position:fixed; bottom:0; width:100%;
  background:rgba(0,0,0,.7); padding:10px;
}

#orbit {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px; margin-bottom:10px;
}
.cell {
  aspect-ratio:1; border:1px solid #555;
  display:flex; align-items:center; justify-content:center;
  font-size:10px; color:#aaa;
}
.cell.active { border-color:#0f0; color:#0f0; }
.cell.done { background:#0f0; color:#000; }

#guide { font-size:14px; margin-bottom:5px; }
#progress { font-size:12px; color:#0f0; }

button { padding:10px; width:100%; }
</style>
</head>

<body>
<canvas id="gl"></canvas>

<div id="ui">
  <div id="orbit"></div>
  <div id="guide">Move camera</div>
  <div id="progress">0 / 150</div>
  <button onclick="capture()">Capture</button>
</div>

<script>
const video = document.createElement("video");
video.autoplay = true;
video.playsInline = true;

let orientation = { alpha:null, beta:null, gamma:null };
let motion = {};

let images = [];
let visited = new Set();

// ================= CAMERA =================
navigator.mediaDevices.getUserMedia({
  video: { facingMode: "environment" }
}).then(stream=>{
  video.srcObject = stream;
  video.play();
});

// ================= SENSORS =================
async function enableSensors() {
  try {
    if (typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function") {
      await DeviceOrientationEvent.requestPermission();
    }
  } catch(e){}

  window.addEventListener("deviceorientation", e=>{
    orientation = {
      alpha:e.alpha,
      beta:e.beta,
      gamma:e.gamma
    };
  });

  window.addEventListener("devicemotion", e=>{
    motion = {
      accel:e.acceleration,
      accelG:e.accelerationIncludingGravity,
      rotation:e.rotationRate
    };
  });
}
document.body.addEventListener("click", enableSensors, { once:true });

// ================= WEBGL =================
const gl = document.getElementById("gl").getContext("webgl");

const vs = `
attribute vec2 p;
varying vec2 uv;
void main(){
  uv = vec2(p.x*0.5+0.5, 1.0-(p.y*0.5+0.5)); // FIX FLIP
  gl_Position = vec4(p,0,1);
}`;

const fs = `
precision mediump float;
uniform sampler2D tex;
varying vec2 uv;

void main(){
  vec4 c = texture2D(tex, uv);

  // crosshair
  float line = step(0.495, uv.x)*step(uv.x,0.505)
             + step(0.495, uv.y)*step(uv.y,0.505);

  vec3 color = mix(c.rgb, vec3(0,1,0), line);
  gl_FragColor = vec4(color,1.0);
}`;

function shader(type, src){
  let s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER,vs));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER,
  new Float32Array([-1,-1, 1,-1, -1,1, 1,1]),
  gl.STATIC_DRAW);

const loc = gl.getAttribLocation(prog,"p");
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);

gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

const uTex = gl.getUniformLocation(prog,"tex");
gl.uniform1i(uTex,0);

// ================= ORBIT MAP =================
const orbitDiv = document.getElementById("orbit");
const cells = [];
const labels = ["L-U","C-U","R-U","L-M","C","R-M","L-D","C-D","R-D"];

labels.forEach((label,i)=>{
  const d = document.createElement("div");
  d.className = "cell";
  d.textContent = label;
  orbitDiv.appendChild(d);
  cells.push(d);
});

// ================= GUIDANCE =================
function getSector(){
  let h = orientation.gamma || 0;
  let v = orientation.beta || 0;

  let x = h < -10 ? 0 : h > 10 ? 2 : 1;
  let y = v < -10 ? 0 : v > 10 ? 2 : 1;

  return y*3 + x;
}

function updateGuide(){
  let s = getSector();

  cells.forEach((c,i)=>{
    c.classList.toggle("active", i===s);
    c.classList.toggle("done", visited.has(i));
  });

  let msg = "Move camera";
  if (!visited.has(s)) msg = "Good angle → capture";
  else msg = "Explore new angle";

  document.getElementById("guide").textContent = msg;
}

// ================= CAPTURE =================
function capture(){
  let s = getSector();

  const c = document.createElement("canvas");
  c.width = video.videoWidth;
  c.height = video.videoHeight;
  c.getContext("2d").drawImage(video,0,0);

  const metadata = {
    version: "v1.1",
    timestamp: Date.now(),

    orientation,
    motion,

    screen: {
      width: screen.width,
      height: screen.height,
      orientation: screen.orientation?.type
    },

    camera: {
      width: video.videoWidth,
      height: video.videoHeight,
      facing: "environment"
    },

    device: {
      userAgent: navigator.userAgent,
      platform: navigator.platform,
      language: navigator.language
    },

    orbitSector: s
  };

  images.push({ img:c.toDataURL(), meta:metadata });
  visited.add(s);

  document.getElementById("progress").textContent =
    images.length + " / 150";
}

// ================= LOOP =================
function loop(){
  if(video.readyState >= 2){
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);

    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }

  updateGuide();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
