<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial;
  text-align:center;
}

canvas {
  width:100vw;
  height:60vh;
  display:block;
}

button {
  padding:12px 20px;
  margin:10px;
  font-size:16px;
}

#gallery {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  padding:10px;
  justify-content:center;
}

.item {
  width:120px;
  font-size:10px;
  text-align:left;
}

.item img {
  width:100%;
  border-radius:6px;
}
</style>
</head>
<body>

<canvas id="gl"></canvas>

<div>
  <button onclick="capture()">📸 Capture</button>
  <button onclick="downloadAll()">⬇️ Download</button>
</div>

<div id="gallery"></div>

<script>
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl");

let video = document.createElement("video");
video.autoplay = true;
video.playsInline = true;

let texture;
let captures = [];
let motion = {};
let orientation = {};

// ------------------ SHADERS ------------------
const vs = `
attribute vec2 pos;
varying vec2 uv;
void main(){
  uv = vec2(pos.x*0.5+0.5, 1.0-(pos.y*0.5+0.5)); // FIXED FLIP
  gl_Position = vec4(pos,0,1);
}`;

const fs = `
precision mediump float;
varying vec2 uv;
uniform sampler2D tex;

void main(){
  vec4 color = texture2D(tex, uv);

  // crosshair
  float lineX = step(abs(uv.x-0.5), 0.003);
  float lineY = step(abs(uv.y-0.5), 0.003);

  if(lineX>0.0 || lineY>0.0){
    color = vec4(0.0,1.0,0.0,1.0);
  }

  gl_FragColor = color;
}`;

// ------------------ INIT ------------------
function compile(src, type){
  let s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  return s;
}

let prog = gl.createProgram();
gl.attachShader(prog, compile(vs, gl.VERTEX_SHADER));
gl.attachShader(prog, compile(fs, gl.FRAGMENT_SHADER));
gl.linkProgram(prog);
gl.useProgram(prog);

let buffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
  -1,-1, 1,-1, -1,1, 1,1
]), gl.STATIC_DRAW);

let pos = gl.getAttribLocation(prog,"pos");
gl.enableVertexAttribArray(pos);
gl.vertexAttribPointer(pos,2,gl.FLOAT,false,0,0);

// texture
texture = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, texture);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

// ------------------ CAMERA ------------------
navigator.mediaDevices.getUserMedia({
  video:{ facingMode:"environment" }
}).then(stream=>{
  video.srcObject = stream;

  video.onplaying = ()=>{
    requestAnimationFrame(loop);
  };
});

// ------------------ SENSORS ------------------
window.addEventListener("devicemotion", e=>{
  motion = {
    acc: e.acceleration,
    accG: e.accelerationIncludingGravity,
    rot: e.rotationRate,
    interval: e.interval
  };
});

window.addEventListener("deviceorientation", e=>{
  orientation = {
    alpha:e.alpha,
    beta:e.beta,
    gamma:e.gamma,
    absolute:e.absolute
  };
});

// ------------------ RENDER LOOP ------------------
function loop(){
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.clear(gl.COLOR_BUFFER_BIT);

  if(video.readyState>=2){
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);
  }

  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  requestAnimationFrame(loop);
}

// ------------------ CAPTURE ------------------
function capture(){
  let c = document.createElement("canvas");
  c.width = video.videoWidth;
  c.height = video.videoHeight;
  let ctx = c.getContext("2d");
  ctx.drawImage(video,0,0);

  let img = c.toDataURL();

  let meta = {
    time: new Date().toISOString(),

    // orientation
    alpha: orientation.alpha,
    beta: orientation.beta,
    gamma: orientation.gamma,

    // motion
    accX: motion.acc?.x,
    accY: motion.acc?.y,
    accZ: motion.acc?.z,

    accGX: motion.accG?.x,
    accGY: motion.accG?.y,
    accGZ: motion.accG?.z,

    rotA: motion.rot?.alpha,
    rotB: motion.rot?.beta,
    rotG: motion.rot?.gamma,

    interval: motion.interval,

    // device info
    userAgent: navigator.userAgent,
    platform: navigator.platform,

    // screen
    screenW: screen.width,
    screenH: screen.height,
    orientationScreen: screen.orientation?.type
  };

  captures.push({img, meta});
  renderGallery();
}

// ------------------ GALLERY ------------------
function renderGallery(){
  let g = document.getElementById("gallery");
  g.innerHTML = "";

  captures.forEach(c=>{
    let div = document.createElement("div");
    div.className="item";

    div.innerHTML = `
      <img src="${c.img}">
      <pre>${JSON.stringify(c.meta,null,1)}</pre>
    `;

    g.appendChild(div);
  });
}

// ------------------ DOWNLOAD ------------------
function downloadAll(){
  captures.forEach((c,i)=>{
    let a = document.createElement("a");
    a.href = c.img;
    a.download = "img_"+i+".png";
    a.click();

    let metaBlob = new Blob([JSON.stringify(c.meta,null,2)],{type:"application/json"});
    let url = URL.createObjectURL(metaBlob);

    let b = document.createElement("a");
    b.href = url;
    b.download = "img_"+i+".json";
    b.click();
  });
}
</script>

</body>
</html>
