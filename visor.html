<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin:0;
  font-family:sans-serif;
  background:#000;
  color:#0f0;
  display:flex;
  flex-direction:column;
  height:100vh;
}

#gl {
  width:100%;
  height:40vh;
  background:black;
}

#ui {
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

#meta {
  background:#111;
  padding:10px;
  height:200px;
  overflow-y:auto;
  font-size:12px;
  white-space:pre-wrap;
  border:1px solid #333;
}

button {
  padding:12px;
  font-size:16px;
  background:#222;
  color:#0f0;
  border:1px solid #0f0;
}

#gallery {
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

#gallery img {
  width:60px;
  height:60px;
  object-fit:cover;
}
</style>
</head>

<body>

<canvas id="gl"></canvas>

<div id="ui">
  <button id="captureBtn">Capture</button>
  <button id="downloadBtn">Download JSON + Images</button>

  <div id="meta"></div>
  <div id="gallery"></div>
</div>

<script>
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl");

canvas.width = innerWidth;
canvas.height = innerHeight * 0.4;
gl.viewport(0,0,canvas.width,canvas.height);

// ---------- VIDEO ----------
const video = document.createElement("video");
video.autoplay = true;
video.playsInline = true;

// ---------- CAMERA ----------
navigator.mediaDevices.getUserMedia({
  video:{ facingMode:"environment" }
}).then(stream=>{
  video.srcObject = stream;
});

// ---------- SHADERS ----------
const vs = `
attribute vec2 position;
varying vec2 uv;
void main(){
  uv = vec2(position.x*0.5+0.5, 1.0-(position.y*0.5+0.5));
  gl_Position = vec4(position,0,1);
}`;

const fs = `
precision mediump float;
uniform sampler2D tex;
varying vec2 uv;

void main(){
  vec4 c = texture2D(tex, uv);

  float cx = abs(uv.x - 0.5);
  float cy = abs(uv.y - 0.5);

  if(cx < 0.002 || cy < 0.002){
    gl_FragColor = vec4(0.0,1.0,0.0,1.0);
  } else {
    gl_FragColor = vec4(c.rgb,1.0);
  }
}`;

// ---------- COMPILE ----------
function compile(type,src){
  const s = gl.createShader(type);
  gl.shaderSource(s,src);
  gl.compileShader(s);
  return s;
}

const program = gl.createProgram();
gl.attachShader(program,compile(gl.VERTEX_SHADER,vs));
gl.attachShader(program,compile(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(program);
gl.useProgram(program);

// ---------- QUAD ----------
const buffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([
  -1,-1, 1,-1, -1,1, 1,1
]),gl.STATIC_DRAW);

const pos = gl.getAttribLocation(program,"position");
gl.enableVertexAttribArray(pos);
gl.vertexAttribPointer(pos,2,gl.FLOAT,false,0,0);

// ---------- TEXTURE ----------
const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D,tex);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);

gl.uniform1i(gl.getUniformLocation(program,"tex"),0);

// ---------- SENSOR DATA ----------
let sensorData = {};

if (window.DeviceOrientationEvent) {
  window.addEventListener("deviceorientation", e=>{
    sensorData.alpha = e.alpha;
    sensorData.beta = e.beta;
    sensorData.gamma = e.gamma;
  });
}

if (window.DeviceMotionEvent) {
  window.addEventListener("devicemotion", e=>{
    sensorData.acc = e.acceleration;
    sensorData.accG = e.accelerationIncludingGravity;
    sensorData.rot = e.rotationRate;
  });
}

// ---------- STORAGE ----------
const captures = [];

// ---------- CAPTURE ----------
document.getElementById("captureBtn").onclick = ()=>{
  const capCanvas = document.createElement("canvas");
  capCanvas.width = video.videoWidth;
  capCanvas.height = video.videoHeight;
  const ctx = capCanvas.getContext("2d");
  ctx.drawImage(video,0,0);

  const img = capCanvas.toDataURL("image/jpeg");

  const meta = {
    time: Date.now(),
    orientation: {
      alpha: sensorData.alpha,
      beta: sensorData.beta,
      gamma: sensorData.gamma
    },
    motion: sensorData.acc,
    rotation: sensorData.rot,
    screen: {
      width: screen.width,
      height: screen.height,
      orientation: screen.orientation?.type
    }
  };

  captures.push({img,meta});

  // show metadata
  document.getElementById("meta").textContent =
    JSON.stringify(meta,null,2);

  // thumbnail
  const thumb = document.createElement("img");
  thumb.src = img;
  document.getElementById("gallery").appendChild(thumb);
};

// ---------- DOWNLOAD ----------
document.getElementById("downloadBtn").onclick = ()=>{
  const data = JSON.stringify(captures,null,2);
  const blob = new Blob([data],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "scan.json";
  a.click();
};

// ---------- RENDER LOOP ----------
function loop(){
  if(video.readyState >= 2){
    gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);
  }

  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  requestAnimationFrame(loop);
}

video.onplaying = ()=>loop();
</script>

</body>
</html>
