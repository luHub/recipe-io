<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>6-View 3D Scanner Capture</title>
<style>
body { margin:0; background:black; overflow:hidden; font-family:sans-serif; }
canvas { width:100vw; height:100vh; display:block; }

#ui {
  position:fixed;
  top:20px;
  width:100%;
  text-align:center;
  color:white;
  font-size:20px;
}

button {
  margin-top:10px;
  font-size:18px;
  padding:10px 20px;
}
</style>
</head>
<body>

<div id="ui">
  <div id="step">Tap to start scanner</div>
  <button id="btn">Start</button>
</div>

<canvas id="gl"></canvas>

<script>
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl");

canvas.width = innerWidth;
canvas.height = innerHeight;
gl.viewport(0,0,canvas.width,canvas.height);

gl.clearColor(0,0,0,1);

// ===== VIDEO =====
const video = document.createElement("video");
video.autoplay = true;
video.playsInline = true;
video.muted = true;

// ===== CAPTURE STEPS =====
const steps = ["FRONT", "BACK", "LEFT", "RIGHT", "UP", "DOWN"];
let index = 0;
let images = [];

// ===== UI =====
const stepText = document.getElementById("step");
const btn = document.getElementById("btn");

function updateUI(){
  stepText.innerText = index < steps.length
    ? `Point camera: ${steps[index]}`
    : "Done! Download images";
}

// ===== CAMERA START =====
async function startCamera(){
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment" }
  });

  video.srcObject = stream;
  await video.play();

  document.getElementById("btn").innerText = "Capture";
  updateUI();
}

// ===== CAPTURE FRAME =====
function capture(){
  const temp = document.createElement("canvas");
  temp.width = video.videoWidth;
  temp.height = video.videoHeight;

  const ctx = temp.getContext("2d");
  ctx.drawImage(video,0,0);

  const data = temp.toDataURL("image/png");
  images.push({ name: steps[index] + ".png", data });

  index++;

  if(index >= steps.length){
    stepText.innerText = "All views captured ✔";
    btn.innerText = "Download";
  } else {
    updateUI();
  }
}

// ===== DOWNLOAD =====
function downloadAll(){
  images.forEach(img=>{
    const a = document.createElement("a");
    a.href = img.data;
    a.download = img.name;
    a.click();
  });
}

// ===== BUTTON LOGIC =====
btn.onclick = async () => {
  if(!video.srcObject){
    await startCamera();
  } else if(index < steps.length){
    capture();
  } else {
    downloadAll();
  }
};

// ===== SIMPLE VIEW RENDER (optional preview) =====
function loop(){
  gl.clear(gl.COLOR_BUFFER_BIT);
  requestAnimationFrame(loop);
}
loop();

window.addEventListener("resize", ()=>{
  canvas.width = innerWidth;
  canvas.height = innerHeight;
  gl.viewport(0,0,canvas.width,canvas.height);
});
</script>

</body>
</html>
