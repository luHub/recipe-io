<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { margin:0; background:#000; color:#0f0; font-family:monospace; }
canvas { width:100%; height:60vh; display:block; }
#ui { padding:10px; }
button { margin:5px; padding:10px; font-size:16px; }
#gallery img { width:80px; margin:4px; border:1px solid #0f0; }
</style>
</head>
<body>

<canvas id="gl"></canvas>

<div id="ui">
  <button onclick="capture()">📸 Capture</button>
  <button onclick="downloadAll()">⬇️ Download All</button>
  <div id="status">0 photos</div>
  <div id="gallery"></div>
</div>

<script>
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl");

// 🔥 FIX: match real resolution
function resize(){
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}
resize();
window.addEventListener("resize", resize);

// ---------- SHADERS ----------
const vs = `
attribute vec2 p;
varying vec2 uv;
void main(){
  uv = (p+1.0)*0.5;
  gl_Position = vec4(p,0,1);
}`;

const fs = `
precision mediump float;
uniform sampler2D tex;
uniform float progress;
varying vec2 uv;

void main(){
  vec2 t = vec2(uv.x, 1.0-uv.y);
  vec4 color = texture2D(tex, t);

  float line = step(abs(uv.x-0.5), 0.002) + step(abs(uv.y-0.5), 0.002);
  float d = distance(uv, vec2(0.5));
  float circle = smoothstep(0.25, 0.255, d) - smoothstep(0.255, 0.26, d);

  float angle = atan(uv.y-0.5, uv.x-0.5);
  float normAngle = (angle + 3.1416) / (2.0*3.1416);
  float ring = step(d, 0.35) * step(0.30, d);
  float prog = step(normAngle, progress) * ring;

  vec3 overlay = vec3(0.0);
  if(line > 0.0 || circle > 0.0 || prog > 0.0){
    overlay = vec3(0.0,1.0,0.0);
  }

  gl_FragColor = vec4(color.rgb + overlay, 1.0);
}`;

// ---------- COMPILE ----------
function compile(type, src){
  let s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  return s;
}

let prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);

// ---------- GEOMETRY ----------
let buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
  -1,-1, 1,-1, -1,1, 1,1
]), gl.STATIC_DRAW);

let loc = gl.getAttribLocation(prog, "p");
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

// ---------- TEXTURE ----------
let tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);

// 🔥 FIX: initialize texture (prevents black frame)
gl.texImage2D(
  gl.TEXTURE_2D, 0, gl.RGBA,
  1, 1, 0,
  gl.RGBA, gl.UNSIGNED_BYTE,
  new Uint8Array([0,0,0,255])
);

gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

// 🔥 FIX: flip camera correctly
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

gl.uniform1i(gl.getUniformLocation(prog, "tex"), 0);
let progressLoc = gl.getUniformLocation(prog, "progress");

// ---------- VIDEO ----------
let video = document.createElement("video");
video.autoplay = true;
video.playsInline = true;
video.muted = true;

// 🔥 important on mobile
video.setAttribute("playsinline", "");
video.setAttribute("muted", "");

navigator.mediaDevices.getUserMedia({
  video:{ facingMode:"environment" }
}).then(stream=>{
  video.srcObject = stream;
});

// ---------- CAPTURE ----------
let captures = [];
let MAX = 24;

function capture(){
  if(video.readyState < 2) return;

  let c = document.createElement("canvas");
  c.width = video.videoWidth;
  c.height = video.videoHeight;
  c.getContext("2d").drawImage(video,0,0);

  let data = c.toDataURL("image/png");
  captures.push(data);

  let img = document.createElement("img");
  img.src = data;
  document.getElementById("gallery").appendChild(img);

  document.getElementById("status").innerText =
    captures.length + " / " + MAX + " photos";
}

function downloadAll(){
  captures.forEach((img, i)=>{
    let a = document.createElement("a");
    a.href = img;
    a.download = "capture_" + i + ".png";
    a.click();
  });
}

// ---------- RENDER LOOP ----------
// 🔥 FIX: only start AFTER video is actually playing
video.addEventListener("playing", ()=>{
  requestAnimationFrame(loop);
});

function loop(){
  resize();

  gl.viewport(0,0,canvas.width,canvas.height);
  gl.clear(gl.COLOR_BUFFER_BIT);

  if(video.readyState >= 2){
    gl.bindTexture(gl.TEXTURE_2D, tex);

    // 🔥 CRITICAL: update texture every frame
    gl.texImage2D(
      gl.TEXTURE_2D, 0, gl.RGBA,
      gl.RGBA, gl.UNSIGNED_BYTE,
      video
    );
  }

  let progress = captures.length / MAX;
  gl.uniform1f(progressLoc, progress);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  requestAnimationFrame(loop);
}
</script>

</body>
</html>
