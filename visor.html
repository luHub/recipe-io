<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#050507;
  --panel:#0c1220;
  --panel2:#0f1830;
  --text:#eaeaf2;
  --accent:#00aaff;
}

body{
  margin:0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color:var(--text);
}

.topbar{
  display:flex;
  justify-content:space-between;
  padding:10px 16px;
}

.title{
  font-size:14px;
  letter-spacing:2px;
  opacity:0.8;
}

.container{
  padding:16px;
  max-width:600px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.card{
  background: linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid rgba(0,170,255,0.25);
  border-radius:14px;
  padding:18px;
}

button{
  width:100%;
  background:#000;
  color:#fff;
  border:1px solid var(--accent);
  padding:14px;
  border-radius:10px;
  cursor:pointer;
  margin-top:10px;
  font-weight:bold;
}

canvas{
  width:100%;
  height:300px;
  border-radius:12px;
  border:1px solid rgba(0,170,255,0.3);
}

#gallery{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.item{
  width:100px;
  font-size:9px;
}

.item img{
  width:100%;
  border:1px solid var(--accent);
  border-radius:6px;
}

#log{
  height:80px;
  overflow:auto;
  border:1px solid rgba(0,170,255,0.3);
  padding:8px;
  font-size:10px;
  border-radius:8px;
  background:#000;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="title">3D SCANNER v0.2</div>
</div>

<div class="container">

  <div class="card">
    <canvas id="gl"></canvas>

    <button onclick="start()">▶ Start Camera</button>
    <button onclick="enableSensors()">📡 Enable Sensors</button>
    <button onclick="toggleFlip()">🔄 Flip Camera</button>
    <button onclick="capture()">📸 Capture</button>
    <button onclick="downloadAll()">⬇️ Download</button>
  </div>

  <div class="card">
    <div id="gallery"></div>
  </div>

  <div class="card">
    <div id="log"></div>
  </div>

</div>

<script>
// ---------- LOG ----------
function log(msg){
  document.getElementById("log").innerText += msg + "\n";
}

// ---------- WEBGL ----------
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl");

function resize(){
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}
resize();

// ---------- SHADERS ----------
const vs = `
attribute vec2 p;
varying vec2 uv;
void main(){
 uv=(p+1.0)*0.5;
 gl_Position=vec4(p,0,1);
}`;

const fs = `
precision mediump float;
uniform sampler2D tex;
uniform float flipY;
varying vec2 uv;

void main(){
 vec2 t = vec2(uv.x, mix(uv.y, 1.0 - uv.y, flipY));
 vec4 c = texture2D(tex, t);

 float cross =
   step(abs(uv.x-0.5), 0.002) +
   step(abs(uv.y-0.5), 0.002);

 gl_FragColor = vec4(c.rgb + (cross>0.0?vec3(0,1,0):vec3(0)),1.0);
}`;

// ---------- INIT ----------
function compile(type,src){
 let s=gl.createShader(type);
 gl.shaderSource(s,src);
 gl.compileShader(s);
 return s;
}

let prog=gl.createProgram();
gl.attachShader(prog,compile(gl.VERTEX_SHADER,vs));
gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(prog);
gl.useProgram(prog);

// ---------- QUAD ----------
let buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([
 -1,-1, 1,-1, -1,1, 1,1
]),gl.STATIC_DRAW);

let loc=gl.getAttribLocation(prog,"p");
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

// ---------- TEXTURE ----------
let tex=gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D,tex);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);

gl.uniform1i(gl.getUniformLocation(prog,"tex"),0);

// ---------- FLIP ----------
let flipLoc = gl.getUniformLocation(prog,"flipY");
let flip = 1.0;
gl.uniform1f(flipLoc, flip);

function toggleFlip(){
 flip = flip === 1.0 ? 0.0 : 1.0;
 gl.uniform1f(flipLoc, flip);
 log("Flip = " + flip);
}

// ---------- VIDEO ----------
let video=document.createElement("video");
video.playsInline=true;
video.muted=true;

// ---------- SENSOR ----------
let sensorData={orientation:{},motion:{}};

async function enableSensors(){
 try{
   if(typeof DeviceMotionEvent.requestPermission==="function"){
     await DeviceMotionEvent.requestPermission();
   }
   if(typeof DeviceOrientationEvent.requestPermission==="function"){
     await DeviceOrientationEvent.requestPermission();
   }

   window.addEventListener("deviceorientation",(e)=>{
     sensorData.orientation=e;
   });

   window.addEventListener("devicemotion",(e)=>{
     sensorData.motion=e;
   });

   log("Sensors enabled");
 }catch(e){
   log("Sensor error");
 }
}

// ---------- START ----------
async function start(){
 const stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:"environment"}
 });

 video.srcObject=stream;
 await video.play();

 render();
 log("Camera started");
}

// ---------- RENDER ----------
function render(){
 resize();
 gl.viewport(0,0,canvas.width,canvas.height);
 gl.clear(gl.COLOR_BUFFER_BIT);

 if(video.readyState>=2){
   gl.bindTexture(gl.TEXTURE_2D,tex);
   gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,
     gl.RGBA,gl.UNSIGNED_BYTE,video);
 }

 gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
 requestAnimationFrame(render);
}

// ---------- CAPTURE ----------
let captures=[];

function capture(){
 let c=document.createElement("canvas");
 c.width=video.videoWidth;
 c.height=video.videoHeight;
 c.getContext("2d").drawImage(video,0,0);

 let data=c.toDataURL("image/png");

 let track = video.srcObject?.getVideoTracks?.()[0];
 let settings = track?.getSettings?.() || {};

 let meta={
   timeISO:new Date().toISOString(),
   timeMS:performance.now(),
   frameIndex:captures.length,

   width:video.videoWidth,
   height:video.videoHeight,
   facingMode:settings.facingMode,
   frameRate:settings.frameRate,

   focalLengthApprox:video.videoWidth*0.8,
   principalPoint:{
     x:video.videoWidth/2,
     y:video.videoHeight/2
   },

   alpha:sensorData.orientation.alpha,
   beta:sensorData.orientation.beta,
   gamma:sensorData.orientation.gamma,

   acc:sensorData.motion.acceleration,
   accGravity:sensorData.motion.accelerationIncludingGravity,
   rotationRate:sensorData.motion.rotationRate,
   interval:sensorData.motion.interval,

   device:{
     userAgent:navigator.userAgent,
     platform:navigator.platform,
     cores:navigator.hardwareConcurrency,
     memory:navigator.deviceMemory
   },

   screen:{
     w:screen.width,
     h:screen.height,
     ratio:window.devicePixelRatio,
     orientation:screen.orientation?.type
   }
 };

 captures.push({data,meta});

 let div=document.createElement("div");
 div.className="item";

 let img=document.createElement("img");
 img.src=data;

 let txt=document.createElement("div");
 txt.innerText=JSON.stringify(meta,null,1);

 div.appendChild(img);
 div.appendChild(txt);

 document.getElementById("gallery").appendChild(div);

 log("Captured "+captures.length);
}

// ---------- DOWNLOAD ----------
function downloadAll(){
 captures.forEach((c,i)=>{
   let a=document.createElement("a");
   a.href=c.data;
   a.download="capture_"+i+".png";
   a.click();

   let blob=new Blob([JSON.stringify(c.meta,null,2)],{type:"application/json"});
   let url=URL.createObjectURL(blob);

   let b=document.createElement("a");
   b.href=url;
   b.download="capture_"+i+".json";
   b.click();
 });
 log("Download done");
}
</script>

</body>
</html>
