<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { margin:0; background:black; }
canvas { width:100vw; height:100vh; display:block; }
</style>
</head>
<body>

<video id="v" autoplay playsinline muted></video>
<canvas id="gl"></canvas>

<script>
const video = document.getElementById("v");
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl");

canvas.width = innerWidth;
canvas.height = innerHeight;
gl.viewport(0,0,canvas.width,canvas.height);

gl.clearColor(0,0,0,1);
gl.disable(gl.DEPTH_TEST);
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

// ===== CAMERA =====
navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" } })
.then(stream=>{
  video.srcObject = stream;
  video.play();
});

// ===== CAPTURE SYSTEM =====
const faces = ["FRONT","RIGHT","LEFT","UP","DOWN","REAR"];
let currentFace = 0;
const captures = {};

window.addEventListener("click", ()=>{
  if(video.readyState >= 2){
    const c = document.createElement("canvas");
    c.width = video.videoWidth;
    c.height = video.videoHeight;
    const ctx = c.getContext("2d");
    ctx.drawImage(video,0,0);

    captures[faces[currentFace]] = c;

    currentFace++;

    if(currentFace >= faces.length){
      console.log("DONE", captures);
      currentFace = faces.length - 1;
    }
  }
});

// ===== SHADERS =====
function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  return s;
}

const vs = compile(gl.VERTEX_SHADER, `
attribute vec2 p;
varying vec2 uv;
void main(){
  uv = (p+1.0)*0.5;
  gl_Position = vec4(p,0,1);
}`);

const fs = compile(gl.FRAGMENT_SHADER, `
precision mediump float;
varying vec2 uv;
uniform sampler2D tex;
uniform float progress;

float rect(vec2 uv, vec2 pos, vec2 size){
  vec2 d = abs(uv - pos) - size;
  return step(max(d.x, d.y), 0.0);
}

float border(vec2 uv, vec2 pos, vec2 size, float thickness){
  float outer = rect(uv, pos, size);
  float inner = rect(uv, pos, size - vec2(thickness));
  return outer - inner;
}

void main(){

  vec4 cam = texture2D(tex, uv);
  vec3 col = cam.rgb;

  vec2 center = vec2(0.5,0.5);
  vec2 size = vec2(0.25,0.2);

  float fill = rect(uv, center, size);
  float edge = border(uv, center, size, 0.01);

  // progress color shift
  vec3 color = mix(vec3(0.0,1.0,0.0), vec3(0.0,0.5,1.0), progress);

  col = mix(col, color, fill * 0.15);
  col = mix(col, color, edge);

  // progress bar
  float bar = rect(uv, vec2(0.5,0.1), vec2(progress * 0.4, 0.02));
  col = mix(col, vec3(0.0,1.0,0.0), bar);

  gl_FragColor = vec4(col,1.0);
}
`);

const prog = gl.createProgram();
gl.attachShader(prog, vs);
gl.attachShader(prog, fs);
gl.linkProgram(prog);
gl.useProgram(prog);

// ===== QUAD =====
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
  -1,-1, 1,-1, -1,1, 1,1
]), gl.STATIC_DRAW);

const loc = gl.getAttribLocation(prog,"p");
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

// ===== TEXTURE =====
const tex = gl.createTexture();
const texLoc = gl.getUniformLocation(prog,"tex");
const progLoc = gl.getUniformLocation(prog,"progress");

gl.activeTexture(gl.TEXTURE0);
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.uniform1i(texLoc, 0);

gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

// ===== LOOP =====
function loop(){

  if(video.readyState >= 2){
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);
  }

  // update progress
  gl.uniform1f(progLoc, currentFace / float(6.0));

  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
