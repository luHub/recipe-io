<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial;
  display:flex;
  flex-direction:column;
  height:100vh;
}

#view {
  position:relative;
  flex:1;
}

canvas {
  width:100%;
  height:100%;
  display:block;
}

#controls {
  padding:10px;
  background:#111;
  display:flex;
  gap:10px;
  justify-content:center;
}

button {
  padding:10px 16px;
  font-size:14px;
}

#gallery {
  max-height:30vh;
  overflow:auto;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  padding:10px;
  background:#000;
}

.item {
  width:120px;
  font-size:10px;
}

.item img {
  width:100%;
  border-radius:6px;
}
</style>
</head>

<body>

<div id="view">
  <canvas id="gl"></canvas>
</div>

<div id="controls">
  <button onclick="capture()">📸 Capture</button>
  <button onclick="downloadAll()">⬇️ Download</button>
</div>

<div id="gallery"></div>

<script>
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl");

let video = document.createElement("video");
video.autoplay = true;
video.playsInline = true;

let texture;
let captures = [];
let motion = {};
let orientation = {};

// ---------- FIX CANVAS SIZE ----------
function resize(){
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}
window.addEventListener("resize", resize);
resize();

// ---------- SHADERS ----------
const vs = `
attribute vec2 pos;
varying vec2 uv;
void main(){
  uv = vec2(pos.x*0.5+0.5, 1.0-(pos.y*0.5+0.5));
  gl_Position = vec4(pos,0,1);
}`;

const fs = `
precision mediump float;
varying vec2 uv;
uniform sampler2D tex;

void main(){
  vec4 color = texture2D(tex, uv);

  // crosshair
  float cx = step(abs(uv.x-0.5), 0.003);
  float cy = step(abs(uv.y-0.5), 0.003);

  if(cx>0.0 || cy>0.0){
    color = vec4(0.0,1.0,0.0,1.0);
  }

  gl_FragColor = color;
}`;

// ---------- INIT ----------
function compile(src,type){
  let s = gl.createShader(type);
  gl.shaderSource(s,src);
  gl.compileShader(s);
  return s;
}

let prog = gl.createProgram();
gl.attachShader(prog, compile(vs,gl.VERTEX_SHADER));
gl.attachShader(prog, compile(fs,gl.FRAGMENT_SHADER));
gl.linkProgram(prog);
gl.useProgram(prog);

let buffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
  -1,-1, 1,-1, -1,1, 1,1
]), gl.STATIC_DRAW);

let pos = gl.getAttribLocation(prog,"pos");
gl.enableVertexAttribArray(pos);
gl.vertexAttribPointer(pos,2,gl.FLOAT,false,0,0);

// ---------- TEXTURE ----------
texture = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, texture);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

// ---------- CAMERA ----------
navigator.mediaDevices.getUserMedia({
  video:{ facingMode:"environment" }
}).then(stream=>{
  video.srcObject = stream;

  video.onplaying = ()=>{
    requestAnimationFrame(loop);
  };
});

// ---------- SENSORS ----------
window.addEventListener("devicemotion", e=>{
  motion = e;
});

window.addEventListener("deviceorientation", e=>{
  orientation = e;
});

// ---------- LOOP ----------
function loop(){
  resize();
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.clear(gl.COLOR_BUFFER_BIT);

  if(video.readyState>=2){
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);
  }

  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  requestAnimationFrame(loop);
}

// ---------- CAPTURE ----------
function capture(){
  let c = document.createElement("canvas");
  c.width = video.videoWidth;
  c.height = video.videoHeight;
  let ctx = c.getContext("2d");
  ctx.drawImage(video,0,0);

  let img = c.toDataURL();

  let meta = {
    time: new Date().toISOString(),
    alpha: orientation.alpha,
    beta: orientation.beta,
    gamma: orientation.gamma,
    acc: motion.acceleration,
    accG: motion.accelerationIncludingGravity,
    rot: motion.rotationRate
  };

  captures.push({img,meta});
  renderGallery();
}

// ---------- GALLERY ----------
function renderGallery(){
  let g = document.getElementById("gallery");
  g.innerHTML="";

  captures.forEach(c=>{
    let div = document.createElement("div");
    div.className="item";
    div.innerHTML = `
      <img src="${c.img}">
      <pre>${JSON.stringify(c.meta,null,1)}</pre>
    `;
    g.appendChild(div);
  });
}

// ---------- DOWNLOAD ----------
function downloadAll(){
  captures.forEach((c,i)=>{
    let a = document.createElement("a");
    a.href = c.img;
    a.download = "img_"+i+".png";
    a.click();
  });
}
</script>

</body>
</html>
