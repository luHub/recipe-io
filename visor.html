<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>3D Scanner Preview</title>
<style>
body { margin:0; overflow:hidden; background:black; display:flex; }

#left {
  width:50%;
  position:relative;
}

#right {
  width:50%;
  background:#111;
}

video {
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}

#ui {
  position:fixed;
  top:10px;
  width:100%;
  text-align:center;
  color:white;
  font-family:sans-serif;
  font-size:18px;
  z-index:10;
}

button {
  margin-top:8px;
  font-size:16px;
  padding:8px 16px;
}
</style>
</head>
<body>

<div id="ui">
  <div id="step">Tap to start scanner</div>
  <button id="btn">Start</button>
</div>

<div id="left">
  <video id="video" autoplay playsinline muted></video>
</div>

<div id="right">
  <canvas id="gl"></canvas>
</div>

<script>
const video = document.getElementById("video");
const stepText = document.getElementById("step");
const btn = document.getElementById("btn");

const steps = ["FRONT","BACK","LEFT","RIGHT","UP","DOWN"];
let index = 0;
let images = [];

// ===== CAMERA =====
async function startCamera(){
  const stream = await navigator.mediaDevices.getUserMedia({
    video:{ facingMode:"environment" }
  });

  video.srcObject = stream;
  await video.play();

  stepText.innerText = "Point camera: FRONT";
  btn.innerText = "Capture";
}

// ===== CAPTURE =====
function capture(){
  const c = document.createElement("canvas");
  c.width = video.videoWidth;
  c.height = video.videoHeight;

  const ctx = c.getContext("2d");
  ctx.drawImage(video,0,0);

  images[index] = c.toDataURL("image/png");

  index++;

  if(index >= steps.length){
    stepText.innerText = "Reconstructing 3D model...";
    build3D();
    btn.disabled = true;
  } else {
    stepText.innerText = "Point camera: " + steps[index];
  }
}

// ===== BUTTON =====
btn.onclick = async () => {
  if(!video.srcObject){
    await startCamera();
  } else {
    capture();
  }
};

// ===== THREE.JS (simple cube reconstruction) =====
let scene, camera, renderer, cube;

function build3D(){
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
  camera.position.z = 2;

  const canvas = document.getElementById("gl");
  renderer = new THREE.WebGLRenderer({ canvas });
  renderer.setSize(window.innerWidth/2, window.innerHeight);

  const loader = new THREE.TextureLoader();

  const materials = steps.map((_,i)=>{
    const tex = loader.load(images[i]);
    return new THREE.MeshBasicMaterial({ map: tex });
  });

  const geometry = new THREE.BoxGeometry(1,1,1);
  cube = new THREE.Mesh(geometry, materials);

  scene.add(cube);

  animate();
}

function animate(){
  requestAnimationFrame(animate);

  cube.rotation.y += 0.01;
  cube.rotation.x += 0.005;

  renderer.render(scene, camera);
}

// ===== INIT GL CANVAS SIZE =====
window.addEventListener("resize", ()=>{
  if(renderer){
    renderer.setSize(window.innerWidth/2, window.innerHeight);
  }
});
</script>

<!-- THREE.JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

</body>
</html>
