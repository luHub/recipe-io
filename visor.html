<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#050507;
  --panel:#0c1220;
  --panel2:#0f1830;
  --text:#eaeaf2;
  --accent:#00aaff;
}

body{
  margin:0;
  font-family: Arial;
  background:var(--bg);
  color:var(--text);
}

.container{
  padding:16px;
  max-width:600px;
  margin:auto;
}

.card{
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid rgba(0,170,255,0.3);
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}

canvas{
  width:100%;
  height:260px;
  border-radius:10px;
}

button{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:8px;
  border:1px solid var(--accent);
  background:#000;
  color:#fff;
}

#gallery{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.item{
  width:110px;
  font-size:9px;
}

.item img{
  width:100%;
  border:1px solid var(--accent);
}

#guide{
  text-align:center;
  font-size:14px;
  margin-top:8px;
  color:#00ffaa;
}

#progress{
  font-size:12px;
  text-align:center;
  margin-top:6px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">
  <canvas id="gl"></canvas>

  <div id="guide">Press start</div>
  <div id="progress"></div>

  <button onclick="start()">▶ Start Camera</button>
  <button onclick="enableSensors()">📡 Enable Sensors</button>
  <button onclick="capture()">📸 Capture</button>
  <button onclick="downloadAll()">⬇️ Download</button>
</div>

<div class="card">
  <div id="gallery"></div>
</div>

</div>

<script>

// ---------- WEBGL ----------
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl");

canvas.width = canvas.clientWidth;
canvas.height = canvas.clientHeight;

// SHADERS
const vs = `
attribute vec2 p;
varying vec2 uv;
void main(){
 uv=(p+1.0)*0.5;
 gl_Position=vec4(p,0,1);
}`;

const fs = `
precision mediump float;
uniform sampler2D tex;
varying vec2 uv;

void main(){
 vec2 t = vec2(uv.x,1.0-uv.y);
 vec4 c = texture2D(tex,t);

 float cross =
   step(abs(uv.x-0.5),0.003)+
   step(abs(uv.y-0.5),0.003);

 gl_FragColor = vec4(c.rgb + (cross>0.0?vec3(0,1,0):vec3(0)),1.0);
}`;

// INIT
function compile(type,src){
 let s=gl.createShader(type);
 gl.shaderSource(s,src);
 gl.compileShader(s);
 return s;
}

let prog=gl.createProgram();
gl.attachShader(prog,compile(gl.VERTEX_SHADER,vs));
gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(prog);
gl.useProgram(prog);

// QUAD
let buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([
 -1,-1, 1,-1, -1,1, 1,1
]),gl.STATIC_DRAW);

let loc=gl.getAttribLocation(prog,"p");
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

// TEXTURE
let tex=gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D,tex);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);

// VIDEO
let video=document.createElement("video");
video.playsInline=true;
video.muted=true;

// SENSOR
let sensorData={orientation:null,motion:null};

async function enableSensors(){
 try{
   if(typeof DeviceMotionEvent.requestPermission==="function"){
     await DeviceMotionEvent.requestPermission();
   }
   if(typeof DeviceOrientationEvent.requestPermission==="function"){
     await DeviceOrientationEvent.requestPermission();
   }

   window.addEventListener("deviceorientation",e=>sensorData.orientation=e);
   window.addEventListener("devicemotion",e=>sensorData.motion=e);

   setGuide("Sensors enabled");
 }catch(e){
   setGuide("Sensor denied");
 }
}

// START
async function start(){
 const stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:"environment"}
 });

 video.srcObject=stream;
 await video.play();

 render();
 setGuide("Move around object");
}

// RENDER
function render(){
 gl.viewport(0,0,canvas.width,canvas.height);

 if(video.readyState>=2){
   gl.bindTexture(gl.TEXTURE_2D,tex);
   gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);
 }

 gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
 requestAnimationFrame(render);
}

// ---------- SCAN LOGIC ----------
let captures=[];
let stats={count:0,angles:new Set()};

function getAngleKey(){
 let o=sensorData.orientation;
 if(!o)return "none";
 return `${Math.round(o.alpha/30)}_${Math.round(o.beta/30)}_${Math.round(o.gamma/30)}`;
}

function getQuality(){
 let n=stats.count;
 if(n<6)return "Too low";
 if(n<18)return "Basic";
 if(n<40)return "Good";
 if(n<80)return "High";
 return "Pro";
}

function setGuide(text){
 document.getElementById("guide").innerText=text;
}

function updateProgress(){
 document.getElementById("progress").innerText =
   "Images: "+stats.count+" | Coverage: "+stats.angles.size+" | "+getQuality();
}

// CAPTURE
function capture(){

 let c=document.createElement("canvas");
 c.width=video.videoWidth;
 c.height=video.videoHeight;
 let ctx=c.getContext("2d");
 ctx.drawImage(video,0,0);

 let data=c.toDataURL("image/png");

 let angle=getAngleKey();
 stats.angles.add(angle);
 stats.count++;

 let meta={
   time:new Date().toISOString(),
   angle,
   coverage:stats.angles.size,
   alpha:sensorData.orientation?.alpha,
   beta:sensorData.orientation?.beta,
   gamma:sensorData.orientation?.gamma,
   accel:sensorData.motion?.acceleration,
   rotation:sensorData.motion?.rotationRate
 };

 captures.push({data,meta});

 // UI
 let div=document.createElement("div");
 div.className="item";

 let img=document.createElement("img");
 img.src=data;

 let txt=document.createElement("div");
 txt.innerText=
   "a:"+Math.round(meta.alpha||0)+
   " b:"+Math.round(meta.beta||0)+
   " g:"+Math.round(meta.gamma||0);

 div.appendChild(img);
 div.appendChild(txt);

 document.getElementById("gallery").appendChild(div);

 // GUIDANCE
 if(stats.angles.size<6){
   setGuide("Move around object");
 } else if(stats.angles.size<20){
   setGuide("Add more angles");
 } else if(stats.angles.size<50){
   setGuide("Capture details");
 } else{
   setGuide("High quality scan");
 }

 updateProgress();
}

// DOWNLOAD
function downloadAll(){
 captures.forEach((c,i)=>{
   let a=document.createElement("a");
   a.href=c.data;
   a.download="img_"+i+".png";
   a.click();
 });
}

</script>
</body>
</html>
