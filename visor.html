<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { margin:0; background:#000; color:#0f0; font-family:monospace; }
canvas { width:100%; height:60vh; display:block; }

#ui { padding:10px; }
button { margin:5px; padding:10px; font-size:16px; }

#guide { font-size:14px; margin-top:5px; }

#progress { height:6px; background:#222; margin-top:6px; }
#bar { height:100%; width:0%; background:#0f0; }

#gallery {
  display:flex;
  flex-wrap:wrap;
  margin-top:10px;
}

.item {
  margin:4px;
  text-align:center;
  font-size:10px;
}

.item img {
  width:70px;
  border:1px solid #0f0;
}
</style>
</head>
<body>

<canvas id="gl"></canvas>

<div id="ui">
  <button onclick="start()">▶ Start</button>
  <button onclick="capture()">📸 Capture</button>
  <button onclick="downloadAll()">⬇️ Download All</button>

  <div id="guide">Press START</div>
  <div id="progress"><div id="bar"></div></div>

  <div id="gallery"></div>
</div>

<script>
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl");

function resize(){
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}
resize();
window.addEventListener("resize", resize);

// ---------- SHADERS ----------
const vs = `
attribute vec2 p;
varying vec2 uv;
void main(){
  uv = (p+1.0)*0.5;
  gl_Position = vec4(p,0,1);
}`;

const fs = `
precision mediump float;
uniform sampler2D tex;
varying vec2 uv;

void main(){
  vec2 t = vec2(uv.x,1.0-uv.y);
  vec4 c = texture2D(tex,t);

  float cross =
    step(abs(uv.x-0.5),0.002) +
    step(abs(uv.y-0.5),0.002);

  float d = distance(uv,vec2(0.5));
  float circle = smoothstep(0.25,0.26,d)-smoothstep(0.26,0.27,d);

  vec3 overlay = (cross+circle>0.0) ? vec3(0,1,0) : vec3(0);

  gl_FragColor = vec4(c.rgb+overlay,1.0);
}`;

// ---------- compile ----------
function compile(type,src){
  let s = gl.createShader(type);
  gl.shaderSource(s,src);
  gl.compileShader(s);
  return s;
}

let prog = gl.createProgram();
gl.attachShader(prog,compile(gl.VERTEX_SHADER,vs));
gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(prog);
gl.useProgram(prog);

// ---------- quad ----------
let buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([
  -1,-1,1,-1,-1,1,1,1
]),gl.STATIC_DRAW);

let loc = gl.getAttribLocation(prog,"p");
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

// ---------- texture ----------
let tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D,tex);

gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,
  gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,255]));

gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);

gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
gl.uniform1i(gl.getUniformLocation(prog,"tex"),0);

// ---------- video ----------
let video = document.createElement("video");
video.playsInline = true;
video.muted = true;

// ---------- state ----------
let captures = [];
let MAX = 24;

// ---------- guidance ----------
function updateGuide(){
  let g = document.getElementById("guide");

  if(captures.length === 0){
    g.innerText = "Center object and capture";
  } else if(captures.length < MAX){
    g.innerText = "Move around object ("+captures.length+"/"+MAX+")";
  } else {
    g.innerText = "Done ✅";
  }

  document.getElementById("bar").style.width =
    (captures.length/MAX*100)+"%";
}

// ---------- start ----------
async function start(){
  const stream = await navigator.mediaDevices.getUserMedia({
    video:{ facingMode:"environment" }
  });

  video.srcObject = stream;
  await video.play();

  startRendering();
  updateGuide();
}

// ---------- render ----------
function startRendering(){
  function loop(){
    resize();
    gl.viewport(0,0,canvas.width,canvas.height);
    gl.clear(gl.COLOR_BUFFER_BIT);

    if(video.readyState>=2){
      gl.bindTexture(gl.TEXTURE_2D,tex);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,
        gl.RGBA,gl.UNSIGNED_BYTE,video);
    }

    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    requestAnimationFrame(loop);
  }
  loop();
}

// ---------- capture ----------
function capture(){
  if(video.readyState<2) return;

  let c = document.createElement("canvas");
  c.width = video.videoWidth;
  c.height = video.videoHeight;
  c.getContext("2d").drawImage(video,0,0);

  let data = c.toDataURL("image/png");

  let meta = {
    id: captures.length,
    time: new Date().toLocaleTimeString(),
    width: c.width,
    height: c.height
  };

  captures.push({data, meta});

  let div = document.createElement("div");
  div.className = "item";

  let img = document.createElement("img");
  img.src = data;

  let info = document.createElement("div");
  info.innerText =
    "#" + meta.id +
    " " + meta.time +
    "\n" + meta.width + "x" + meta.height;

  div.appendChild(img);
  div.appendChild(info);

  document.getElementById("gallery").appendChild(div);

  updateGuide();
}

// ---------- download ----------
function downloadAll(){
  captures.forEach((c,i)=>{
    let a = document.createElement("a");
    a.href = c.data;
    a.download = "capture_"+i+".png";
    a.click();
  });
}
</script>

</body>
</html>
