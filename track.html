<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counter Board</title>

<style>
body{
  margin:0;
  font-family:system-ui,sans-serif;
  background:#0f1115;
  color:#e6e6e6;
}

.container{
  max-width:520px;
  margin:0 auto;
  padding:16px;
}

h2{
  font-size:14px;
  letter-spacing:1px;
  color:#888;
}

.item{
  background:#1a1d23;
  border:1px solid #2a2f38;
  border-radius:12px;
  padding:14px;
  margin-bottom:10px;
}

.top{
  display:flex;
  justify-content:space-between;
}

.progress{
  height:6px;
  background:#2a2f38;
  border-radius:6px;
  margin:10px 0;
  overflow:hidden;
}

.bar{
  height:100%;
  background:#4caf50;
}

.controls{
  display:flex;
  gap:6px;
  justify-content:flex-end;
}

button{
  border:none;
  border-radius:8px;
  padding:8px 10px;
  background:#2a2f38;
  color:#ddd;
  cursor:pointer;
}

.increase{ background:#4caf50; color:#fff; }
.delete{ background:#d32f2f; color:#fff; }

.meta{
  font-size:11px;
  color:#777;
  margin-top:6px;
}

.setup{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#1a1d23;
  border-top:1px solid #2a2f38;
  padding:10px;
}

.setup-inner{
  max-width:520px;
  margin:auto;
  display:flex;
  gap:6px;
}

input,select{
  padding:8px;
  border-radius:8px;
  border:1px solid #2a2f38;
  background:#0f1115;
  color:#eee;
}

.limit{ width:60px; }
.reset{ width:90px; }

.add-btn{
  background:#2196f3;
  color:#fff;
}
</style>
</head>

<body>

<div class="container">
  <h2>Items</h2>
  <div id="itemList"></div>
</div>

<div class="setup">
  <div class="setup-inner">
    <input id="nameInput" placeholder="Item">
    <input id="limitInput" class="limit" type="number" placeholder="Goal">
    <select id="resetInput" class="reset">
      <option value="none">No reset</option>
      <option value="day">Daily</option>
      <option value="week">Weekly</option>
      <option value="month">Monthly</option>
    </select>
    <button class="add-btn" onclick="addItem()">Add</button>
  </div>
</div>

<script>
let items = JSON.parse(localStorage.getItem("items")||"[]");

function save(){
  localStorage.setItem("items", JSON.stringify(items));
}

function now(){
  return new Date().toISOString();
}

function shouldReset(item){
  if(item.reset === "none") return false;

  const last = new Date(item.lastReset || item.created);
  const current = new Date();

  if(item.reset === "day"){
    return current.toDateString() !== last.toDateString();
  }

  if(item.reset === "week"){
    const diff = (current - last) / (1000*60*60*24);
    return diff >= 7;
  }

  if(item.reset === "month"){
    return current.getMonth() !== last.getMonth() ||
           current.getFullYear() !== last.getFullYear();
  }

  return false;
}

function checkReset(item){
  if(shouldReset(item)){
    item.count = 0;
    item.start = now();
    item.end = null;
    item.lastReset = now();
  }
}

function render(){
  const list = document.getElementById("itemList");
  list.innerHTML = "";

  items.forEach((item,i)=>{
    checkReset(item);

    const percent = item.limit
      ? Math.min((item.count/item.limit)*100,100)
      : 0;

    const div = document.createElement("div");
    div.className="item";

    div.innerHTML=`
      <div class="top">
        <div>${item.name}</div>
        <div>${item.count}${item.limit?"/"+item.limit:""}</div>
      </div>

      <div class="progress">
        <div class="bar" style="width:${percent}%"></div>
      </div>

      <div class="controls">
        <button class="increase" onclick="inc(${i})">+</button>
        <button onclick="edit(${i})">Edit</button>
        <button class="delete" onclick="del(${i})">Del</button>
      </div>

      <div class="meta">
        Start: ${item.start?new Date(item.start).toLocaleString():"-"}<br>
        End: ${item.end?new Date(item.end).toLocaleString():"-"}
      </div>
    `;

    list.appendChild(div);
  });

  save();
}

function addItem(){
  const name = nameInput.value.trim();
  const limit = parseInt(limitInput.value);
  const reset = resetInput.value;

  if(!name) return;

  items.push({
    name,
    count:0,
    limit:isNaN(limit)?null:limit,
    reset,
    created:now(),
    start:now(),
    end:null,
    lastReset:now()
  });

  nameInput.value="";
  limitInput.value="";

  render();
}

function inc(i){
  const item = items[i];

  if(!item.limit || item.count < item.limit){
    item.count++;

    if(item.count === 1){
      item.start = now();
    }

    if(item.limit && item.count === item.limit){
      item.end = now();
    }
  }

  render();
}

function edit(i){
  const n = prompt("Name", items[i].name);
  const l = prompt("Limit", items[i].limit||"");
  const r = prompt("Reset (none/day/week/month)", items[i].reset);

  if(n!==null) items[i].name=n;
  items[i].limit = l?parseInt(l):null;
  if(r) items[i].reset=r;

  render();
}

function del(i){
  if(!confirm("Delete?")) return;
  items.splice(i,1);
  render();
}

render();
</script>

</body>
</html>
