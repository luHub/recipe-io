<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Call Tracker</title>

<style>
:root{
  --bg:#050507;
  --panel:#0c1220;
  --panel2:#0f1830;
  --text:#eaeaf2;
  --accent:#00aaff;
}

body{
  margin:0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color:var(--text);
}

.topbar{
  padding:10px 16px;
}

.title{
  font-size:14px;
  letter-spacing:2px;
  opacity:0.8;
}

.container{
  padding:16px;
  max-width:600px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.card{
  background: linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid rgba(0,170,255,0.25);
  border-radius:14px;
  padding:18px;
}

input, select{
  width:100%;
  padding:10px;
  margin-top:8px;
  background:#000;
  color:#fff;
  border:1px solid var(--accent);
  border-radius:10px;
}

button{
  width:100%;
  background:#000;
  color:#fff;
  border:1px solid var(--accent);
  padding:14px;
  border-radius:10px;
  margin-top:10px;
  cursor:pointer;
}

.console{
  background:#000;
  color:#0f0;
  font-family: monospace;
  font-size:12px;
  padding:10px;
  height:120px;
  overflow:auto;
  border-radius:10px;
  border:1px solid var(--accent);
}

/* Q BOARD */
.qitem{
  background:#000;
  border:1px solid var(--accent);
  border-radius:10px;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:10px;
}

.qtitle{ font-size:12px; opacity:0.6; }
.qvalue{ font-size:18px; font-weight:bold; }

.plus{
  width:40px;
  height:40px;
  font-size:20px;
}

.footer{
  text-align:center;
  font-size:11px;
  opacity:0.4;
  padding:10px;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="title">MULTI TRACKER</div>
</div>

<div class="container">

  <!-- SELECT COUNTER -->
  <div class="card">
    <h2>COUNTERS</h2>
    <select id="counterSelect" onchange="switchCounter()"></select>
    <button onclick="createCounter()">+ NEW COUNTER</button>
  </div>

  <!-- Q BOARD -->
  <div class="card">
    <h2>Q BOARD</h2>

    <div class="qitem">
      <div>
        <div class="qtitle">NAME</div>
        <div class="qvalue" id="q_name"></div>
      </div>
    </div>

    <div class="qitem">
      <div>
        <div class="qtitle">CALLS</div>
        <div class="qvalue" id="q_calls"></div>
      </div>
      <button class="plus" onclick="triggerCall()">+</button>
    </div>

    <div class="qitem">
      <div>
        <div class="qtitle">WEEK</div>
        <div class="qvalue" id="q_week"></div>
      </div>
    </div>
  </div>

  <!-- SETTINGS -->
  <div class="card">
    <h2>SETTINGS</h2>

    <input id="name" placeholder="Name">
    <input id="limit" type="number" placeholder="Limit">
    <input id="weekly" type="number" placeholder="Weekly Goal">

    <button onclick="saveSettings()">SAVE</button>
    <button onclick="shareToX()">SHARE ON X</button>
  </div>

  <!-- LOG -->
  <div class="card">
    <h2>LOG</h2>
    <div class="console" id="log"></div>
  </div>

</div>

<div class="footer">local session saved</div>

<script>
let data = JSON.parse(localStorage.getItem("multi_counters")) || {
  active: 0,
  counters: [
    {name:"default",limit:5,count:0,weeklyGoal:20,weeklyCount:0,weekStart:new Date().toDateString()}
  ]
};

const select = document.getElementById("counterSelect");
const logBox = document.getElementById("log");

const q_name = document.getElementById("q_name");
const q_calls = document.getElementById("q_calls");
const q_week = document.getElementById("q_week");

const nameInput = document.getElementById("name");
const limitInput = document.getElementById("limit");
const weeklyInput = document.getElementById("weekly");

// SAVE
function save(){
  localStorage.setItem("multi_counters", JSON.stringify(data));
}

// LOG
function log(msg){
  const d=document.createElement("div");
  d.textContent=msg;
  logBox.appendChild(d);
  logBox.scrollTop=logBox.scrollHeight;
}

// POPULATE SELECT
function renderSelect(){
  select.innerHTML="";
  data.counters.forEach((c,i)=>{
    const opt=document.createElement("option");
    opt.value=i;
    opt.textContent=c.name;
    if(i===data.active) opt.selected=true;
    select.appendChild(opt);
  });
}

// SWITCH
function switchCounter(){
  data.active=parseInt(select.value);
  updateUI();
  save();
}

// CURRENT
function current(){
  return data.counters[data.active];
}

// UPDATE UI
function updateUI(){
  const c=current();

  q_name.textContent=c.name;
  q_calls.textContent=`${c.count}/${c.limit}`;
  q_week.textContent=`${c.weeklyCount}/${c.weeklyGoal}`;

  nameInput.value=c.name;
  limitInput.value=c.limit;
  weeklyInput.value=c.weeklyGoal;
}

// NEW COUNTER
function createCounter(){
  data.counters.push({
    name:"new",
    limit:5,
    count:0,
    weeklyGoal:20,
    weeklyCount:0,
    weekStart:new Date().toDateString()
  });
  data.active=data.counters.length-1;
  renderSelect();
  updateUI();
  save();
}

// SAVE SETTINGS
function saveSettings(){
  const c=current();
  c.name=nameInput.value||"default";
  c.limit=parseInt(limitInput.value)||0;
  c.weeklyGoal=parseInt(weeklyInput.value)||0;
  c.count=0;
  c.weeklyCount=0;
  c.weekStart=new Date().toDateString();

  renderSelect();
  updateUI();
  save();

  log("UPDATED");
}

// WEEK RESET
function checkWeek(c){
  const now=new Date();
  const saved=new Date(c.weekStart);
  const diff=Math.floor((now-saved)/(1000*60*60*24));
  if(diff>=7){
    c.weeklyCount=0;
    c.weekStart=now.toDateString();
    log("🔄 reset");
  }
}

// CALL
function triggerCall(){
  const c=current();
  checkWeek(c);

  if(c.count>=c.limit){
    log("❌ limit reached");
    return;
  }

  c.count++;
  c.weeklyCount++;

  log(`+1 ${c.name}`);

  if(c.weeklyCount>=c.weeklyGoal){
    log("🎯 goal hit");
  }

  updateUI();
  save();
}

// SHARE
function shareToX(){
  const c=current();
  const percent = c.weeklyGoal ? Math.floor((c.weeklyCount/c.weeklyGoal)*100) : 0;

  const text = `📊 ${c.name}
Calls: ${c.count}/${c.limit}
Week: ${c.weeklyCount}/${c.weeklyGoal} (${percent}%)

#tracking`;

  window.open("https://twitter.com/intent/tweet?text="+encodeURIComponent(text));
}

// INIT
renderSelect();
updateUI();
</script>

</body>
</html>
