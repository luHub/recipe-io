<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Panel</title>

<style>
:root{
  --bg:#050507;
  --panel:#0c1220;
  --panel2:#0f1830;
  --text:#eaeaf2;
  --accent:#00aaff;
  --danger:#ff3b3b;
}

body{
  margin:0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color:var(--text);
}

.topbar{
  display:flex;
  justify-content:space-between;
  padding:10px 16px;
}

.title{
  font-size:14px;
  letter-spacing:2px;
  opacity:0.8;
}

.container{
  padding:16px;
  max-width:600px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.card{
  background: linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid rgba(0,170,255,0.25);
  border-radius:14px;
  padding:18px;
}

h2{
  margin-top:0;
  font-size:16px;
}

.item{
  border-top:1px solid rgba(255,255,255,0.1);
  padding-top:10px;
  margin-top:10px;
}

.row{
  display:flex;
  justify-content:space-between;
}

.meta{
  font-size:11px;
  opacity:0.6;
  margin-top:6px;
}

.progress{
  height:6px;
  background:#000;
  border-radius:6px;
  margin:10px 0;
  overflow:hidden;
}

.bar{
  height:100%;
  background:var(--accent);
  transition:0.2s;
}

.bar.done{
  background:var(--danger);
}

button{
  background:#000;
  color:#fff;
  border:1px solid var(--accent);
  padding:10px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  margin-top:6px;

  box-shadow:
    0 0 6px rgba(0,170,255,0.4),
    0 0 12px rgba(0,170,255,0.2);
}

button:active{
  transform:scale(0.96);
}

button:disabled{
  opacity:0.4;
  cursor:not-allowed;
}

input,select{
  width:100%;
  padding:10px;
  margin-top:6px;
  background:#000;
  color:#fff;
  border:1px solid var(--accent);
  border-radius:10px;
}

.footer{
  text-align:center;
  font-size:11px;
  opacity:0.4;
  padding:10px;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="title">CONTROL PANEL</div>
</div>

<div class="container">

  <!-- TRACK -->
  <div class="card">
    <h2>TRACK</h2>
    <div id="list"></div>
  </div>

  <!-- SETUP -->
  <div class="card">
    <h2>SETUP</h2>

    <input id="name" placeholder="Item name">
    <input id="limit" type="number" placeholder="Goal (optional)">
    
    <select id="reset">
      <option value="none">No reset</option>
      <option value="day">Daily</option>
      <option value="week">Weekly</option>
      <option value="month">Monthly</option>
    </select>

    <button onclick="add()">ADD ITEM</button>
  </div>

</div>

<div class="footer">local session saved</div>

<script>
let items = JSON.parse(localStorage.getItem("items")||"[]");

function save(){
  localStorage.setItem("items", JSON.stringify(items));
}

function calcEnd(item){
  const start = new Date(item.start);

  if(item.limit && item.count >= item.limit){
    return new Date(); // reached goal
  }

  if(item.reset === "day"){
    const d = new Date(start);
    d.setDate(d.getDate()+1);
    return d;
  }

  if(item.reset === "week"){
    const d = new Date(start);
    d.setDate(d.getDate()+7);
    return d;
  }

  if(item.reset === "month"){
    const d = new Date(start);
    d.setMonth(d.getMonth()+1);
    return d;
  }

  return null;
}

function checkReset(item){
  if(item.reset==="none") return;

  const end = calcEnd(item);
  if(!end) return;

  if(new Date() >= end){
    item.count = 0;
    item.start = new Date().toISOString();
  }
}

function render(){
  const list = document.getElementById("list");
  list.innerHTML="";

  items.forEach((item,i)=>{
    checkReset(item);

    const percent = item.limit
      ? Math.min((item.count/item.limit)*100,100)
      : 0;

    const isDone = item.limit && item.count >= item.limit;
    const end = calcEnd(item);

    const div = document.createElement("div");
    div.className="item";

    div.innerHTML=`
      <div class="row">
        <div>${item.name}</div>
        <div>${item.count}${item.limit?"/"+item.limit:""}</div>
      </div>

      <div class="progress">
        <div class="bar ${isDone ? "done" : ""}" style="width:${percent}%"></div>
      </div>

      <button onclick="inc(${i})" ${isDone ? "disabled" : ""}>+</button>
      <button onclick="edit(${i})">EDIT</button>
      <button onclick="del(${i})">DELETE</button>

      <div class="meta">
        Start: ${new Date(item.start).toLocaleString()}<br>
        End: ${end?end.toLocaleString():"-"}
      </div>
    `;

    list.appendChild(div);
  });

  save();
}

function add(){
  const name = document.getElementById("name").value.trim();
  const limit = parseInt(document.getElementById("limit").value);
  const reset = document.getElementById("reset").value;

  if(!name) return;

  items.push({
    name,
    count:0,
    limit:isNaN(limit)?null:limit,
    reset,
    start:new Date().toISOString()
  });

  name.value="";
  render();
}

function inc(i){
  const item = items[i];

  if(item.limit && item.count >= item.limit) return;

  item.count++;
  render();
}

function edit(i){
  const n = prompt("Name", items[i].name);
  const l = prompt("Limit", items[i].limit||"");
  const r = prompt("Reset (none/day/week/month)", items[i].reset);

  if(n!==null) items[i].name=n;
  items[i].limit = l?parseInt(l):null;
  if(r) items[i].reset=r;

  render();
}

function del(i){
  if(!confirm("Delete item?")) return;
  items.splice(i,1);
  render();
}

render();
</script>

</body>
</html>
