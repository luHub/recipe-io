<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Counter Board</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #0f1115;
      color: #e6e6e6;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 16px;
    }

    h2 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      margin-bottom: 10px;
    }

    .item {
      background: #1a1d23;
      border: 1px solid #2a2f38;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-name {
      font-size: 15px;
      font-weight: 500;
    }

    .count {
      font-size: 14px;
      color: #aaa;
    }

    .progress {
      height: 6px;
      background: #2a2f38;
      border-radius: 6px;
      margin: 10px 0;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      background: #4caf50;
      width: 0%;
      transition: width 0.2s ease;
    }

    .controls {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      cursor: pointer;
      background: #2a2f38;
      color: #ddd;
    }

    .increase {
      background: #4caf50;
      color: white;
    }

    .delete {
      background: #d32f2f;
      color: white;
    }

    /* bottom setup */
    .setup {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1a1d23;
      border-top: 1px solid #2a2f38;
      padding: 12px;
    }

    .setup-inner {
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      gap: 6px;
    }

    input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #2a2f38;
      background: #0f1115;
      color: #eee;
      font-size: 13px;
    }

    .limit {
      max-width: 70px;
      text-align: center;
    }

    .add-btn {
      background: #2196f3;
      color: white;
      padding: 10px 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Items</h2>
    <div id="itemList"></div>
  </div>

  <!-- Setup -->
  <div class="setup">
    <div class="setup-inner">
      <input type="text" id="nameInput" placeholder="Item..." />
      <input type="number" id="limitInput" class="limit" placeholder="Goal" />
      <button class="add-btn" onclick="addItem()">Add</button>
    </div>
  </div>

  <script>
    let items = JSON.parse(localStorage.getItem("items")) || [];

    function save() {
      localStorage.setItem("items", JSON.stringify(items));
    }

    function renderItems() {
      const list = document.getElementById("itemList");
      list.innerHTML = "";

      items.forEach((item, index) => {
        const percent = item.limit ? Math.min((item.count / item.limit) * 100, 100) : 0;

        const div = document.createElement("div");
        div.className = "item";

        div.innerHTML = `
          <div class="top">
            <div class="item-name">${item.name}</div>
            <div class="count">${item.count}${item.limit ? " / " + item.limit : ""}</div>
          </div>

          <div class="progress">
            <div class="bar" style="width:${percent}%"></div>
          </div>

          <div class="controls">
            <button class="increase" onclick="increase(${index})">+</button>
            <button onclick="editItem(${index})">Edit</button>
            <button class="delete" onclick="deleteItem(${index})">Del</button>
          </div>
        `;

        list.appendChild(div);
      });
    }

    function addItem() {
      const name = document.getElementById("nameInput").value.trim();
      const limit = parseInt(document.getElementById("limitInput").value);

      if (!name) return;

      items.push({
        name,
        count: 0,
        limit: isNaN(limit) ? null : limit
      });

      document.getElementById("nameInput").value = "";
      document.getElementById("limitInput").value = "";

      save();
      renderItems();
    }

    function increase(index) {
      const item = items[index];

      if (!item.limit || item.count < item.limit) {
        item.count++;
      }

      save();
      renderItems();
    }

    function editItem(index) {
      const newName = prompt("Name:", items[index].name);
      const newLimit = prompt("Limit:", items[index].limit || "");

      if (newName !== null) items[index].name = newName;
      items[index].limit = newLimit ? parseInt(newLimit) : null;

      save();
      renderItems();
    }

    function deleteItem(index) {
      if (!confirm("Delete item?")) return;

      items.splice(index, 1);
      save();
      renderItems();
    }

    renderItems();
  </script>

</body>
</html>
