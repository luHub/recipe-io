<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Counter Board</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      background: #f2f2f2;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 12px;
    }

    h2 {
      margin: 10px 0;
    }

    .board {
      margin-bottom: 80px;
    }

    .item {
      background: white;
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-name {
      font-size: 16px;
      font-weight: 500;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .count {
      font-weight: bold;
      font-size: 16px;
      min-width: 24px;
      text-align: center;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 14px;
      cursor: pointer;
    }

    .increase {
      background: #4CAF50;
      color: white;
      font-size: 16px;
    }

    .edit {
      background: #FFC107;
    }

    .delete {
      background: #f44336;
      color: white;
    }

    /* Sticky setup bottom */
    .setup {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      padding: 12px;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.1);
    }

    .setup-inner {
      max-width: 500px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    .add-btn {
      background: #2196F3;
      color: white;
      padding: 10px 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="board">
      <h2>Items</h2>
      <div id="itemList"></div>
    </div>
  </div>

  <!-- Sticky setup -->
  <div class="setup">
    <div class="setup-inner">
      <input type="text" id="newItemInput" placeholder="New item..." />
      <button class="add-btn" onclick="addItem()">Add</button>
    </div>
  </div>

  <script>
    let items = JSON.parse(localStorage.getItem("items")) || [];

    function save() {
      localStorage.setItem("items", JSON.stringify(items));
    }

    function renderItems() {
      const list = document.getElementById("itemList");
      list.innerHTML = "";

      items.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "item";

        div.innerHTML = `
          <div class="item-name">${item.name}</div>
          <div class="controls">
            <span class="count">${item.count}</span>
            <button class="increase" onclick="increase(${index})">+</button>
            <button class="edit" onclick="editItem(${index})">✏️</button>
            <button class="delete" onclick="deleteItem(${index})">🗑️</button>
          </div>
        `;

        list.appendChild(div);
      });
    }

    function addItem() {
      const input = document.getElementById("newItemInput");
      const name = input.value.trim();
      if (!name) return;

      items.push({ name, count: 0 });
      input.value = "";
      save();
      renderItems();
    }

    function increase(index) {
      items[index].count++;
      save();
      renderItems();
    }

    function editItem(index) {
      const newName = prompt("Edit item name:", items[index].name);
      if (!newName) return;

      items[index].name = newName;
      save();
      renderItems();
    }

    function deleteItem(index) {
      if (!confirm("Delete this item?")) return;

      items.splice(index, 1);
      save();
      renderItems();
    }

    renderItems();
  </script>

</body>
</html>
