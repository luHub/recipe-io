<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Panel</title>

<style>
:root{
  --bg:#050507;
  --panel:#0c1220;
  --panel2:#0f1830;
  --text:#eaeaf2;
  --accent:#00aaff;
  --danger:#ff3b3b;
}

body{
  margin:0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color:var(--text);
}

.container{
  padding:16px;
  max-width:600px;
  margin:auto;
}

.card{
  background: linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid rgba(0,170,255,0.25);
  border-radius:14px;
  padding:18px;
  margin-bottom:14px;
}

.progress{
  height:6px;
  background:#000;
  border-radius:6px;
  margin:10px 0;
}

.bar{
  height:100%;
  background:var(--accent);
}

.bar.done{
  background:var(--danger);
}

button{
  width:100%;
  margin-top:6px;
  padding:10px;
  background:#000;
  color:#fff;
  border:1px solid var(--accent);
  border-radius:10px;
}

button:disabled{
  opacity:0.4;
}

input,select{
  width:100%;
  padding:10px;
  margin-top:6px;
  background:#000;
  color:#fff;
  border:1px solid var(--accent);
  border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">
    <h2>TRACK</h2>
    <div id="list"></div>
  </div>

  <div class="card">
    <h2>SETUP</h2>
    <input id="name" placeholder="Item">
    <input id="limit" type="number" placeholder="Goal">
    <select id="reset">
      <option value="none">No reset</option>
      <option value="day">Daily</option>
      <option value="week">Weekly</option>
      <option value="month">Monthly</option>
    </select>
    <button onclick="add()">ADD</button>
  </div>

</div>

<script>
let items = JSON.parse(localStorage.getItem("items")||"[]");

function save(){
  localStorage.setItem("items", JSON.stringify(items));
}

function calcEnd(item){
  const start = new Date(item.start);

  if(item.limit && item.count >= item.limit){
    return new Date(); // finished now
  }

  if(item.reset === "day"){
    return new Date(start.getTime() + 86400000);
  }

  if(item.reset === "week"){
    return new Date(start.getTime() + 7*86400000);
  }

  if(item.reset === "month"){
    const d = new Date(start);
    d.setMonth(d.getMonth()+1);
    return d;
  }

  return null;
}

function checkReset(item){
  if(item.reset==="none") return;

  const end = calcEnd(item);
  if(!end) return;

  // IMPORTANT FIX:
  // do NOT reset if goal reached — only reset by time
  if(item.limit && item.count >= item.limit) return;

  if(new Date() >= end){
    item.count = 0;
    item.start = new Date().toISOString();
  }
}

function render(){
  const list = document.getElementById("list");
  list.innerHTML="";

  items.forEach((item,i)=>{
    checkReset(item);

    const isDone = item.limit && item.count >= item.limit;

    const percent = item.limit
      ? Math.min((item.count/item.limit)*100,100)
      : 0;

    const div = document.createElement("div");
    div.className="card";

    div.innerHTML=`
      <div>${item.name}</div>
      <div>${item.count}${item.limit?"/"+item.limit:""}</div>

      <div class="progress">
        <div class="bar ${isDone?"done":""}" style="width:${percent}%"></div>
      </div>

      <button onclick="inc(${i})" ${isDone?"disabled":""}>+</button>
      <button onclick="del(${i})">DELETE</button>
    `;

    list.appendChild(div);
  });

  save();
}

function add(){
  const name = document.getElementById("name").value.trim();
  const limit = parseInt(document.getElementById("limit").value);
  const reset = document.getElementById("reset").value;

  if(!name) return;

  items.push({
    name,
    count:0,
    limit:isNaN(limit)?null:limit,
    reset,
    start:new Date().toISOString()
  });

  render();
}

function inc(i){
  const item = items[i];

  // 🔒 HARD STOP (final fix)
  if(item.limit && item.count >= item.limit){
    item.count = item.limit; // clamp
    return;
  }

  item.count++;

  // clamp safety
  if(item.limit && item.count > item.limit){
    item.count = item.limit;
  }

  render();
}

function del(i){
  items.splice(i,1);
  render();
}

render();
</script>

</body>
</html>
